<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>55CINE - 매거진 삼삼오오 프리뷰</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="components/site-common.css" />
  <style>
    :root {
      --site-font-family: "Spoqa Han Sans Neo", sans-serif;
      --brand-gold: #f0ab2a;
      --brand-ink: #1c1610;
      --brand-bronze: #8b6e3e;
      --bg: #faf8f4;
      --bg-elevated: #fff;
      --text: #1c1610;
      --muted: #6b5d48;
      --line: #e8e2d6;
      --pill-bg: #f3efe6;
      --radius: 14px;
      --shadow: rgba(28, 22, 16, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--site-font-family);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    main { background: var(--bg-elevated); min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }

    .preview-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .view-mode {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }
    .mode-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .mode-btn.is-active {
      background: var(--brand-ink);
      color: #fff;
    }

    .preview-list {
      display: grid;
      gap: 14px;
    }

    .preview-list.is-list .preview-item {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .preview-list.is-thumb {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    @media (min-width: 901px) {
      .preview-list.is-thumb {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    .preview-list.is-thumb .preview-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 12px var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .preview-list.is-thumb .preview-excerpt-link {
      display: none;
    }

    .preview-thumb-link {
      display: block;
      background: #ece7db;
      line-height: 0;
    }
    .preview-thumb {
      width: 100%;
      aspect-ratio: 264 / 200;
      object-fit: cover;
      display: block;
    }
    .preview-body {
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preview-title-link {
      font-size: 1rem;
      font-weight: 700;
      color: var(--brand-ink);
      display: inline;
    }
    .preview-title-link:hover { color: var(--brand-bronze); text-decoration: underline; }
    .preview-excerpt-link {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
      display: inline;
    }

    .pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      padding: 0 10px;
    }
    .page-btn.is-active {
      background: var(--brand-gold);
      border-color: var(--brand-gold);
      color: var(--brand-ink);
    }
    .page-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    @media (max-width: 820px) {
      .preview-list.is-list .preview-item {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 425px) {
      .preview-list.is-thumb {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .preview-list.is-thumb .preview-body {
        padding: 10px 8px 12px;
      }
      .preview-list.is-thumb .preview-title-link {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <div id="site-header-mount"></div>

  <main>
    <section class="preview-page" aria-labelledby="preview-page-title">
      <header class="section-page-head">
        <div class="section-page-head__row">
          <h1 id="preview-page-title" class="section-page-head__title">
            <span class="section-page-head__parent">매거진 삼삼오오</span><span class="section-page-head__sep" aria-hidden="true">·</span><span class="section-page-head__child">프리뷰</span>
          </h1>
          <nav class="section-page-subnav" aria-label="매거진 삼삼오오 하위 메뉴">
            <a href="magazine-preview.html" class="is-current" aria-current="page">프리뷰</a>
            <a href="magazine-serial.html">연재</a>
            <a href="gv-moment.html">GV 모먼트</a>
            <a href="#" class="is-placeholder" tabindex="-1" aria-disabled="true">지난 기사</a>
          </nav>
        </div>
        <div class="section-page-head__rule" role="presentation"></div>
        <div class="section-page-head__meta">
          <span class="result-count" id="resultCount"></span>
        </div>
      </header>

      <div class="toolbar">
        <div class="view-mode" role="tablist" aria-label="목록 보기 방식">
          <button type="button" class="mode-btn is-active" data-view="thumb" role="tab" aria-selected="true">썸네일형</button>
          <button type="button" class="mode-btn" data-view="list" role="tab" aria-selected="false">목록형</button>
        </div>
      </div>

      <div id="previewList" class="preview-list is-thumb" aria-live="polite"></div>
      <nav id="pagination" class="pagination" aria-label="프리뷰 페이지네이션"></nav>
    </section>
  </main>

  <div id="site-footer-mount"></div>

  <!-- 데이터 스크립트는 defer 금지: 인라인 렌더러보다 먼저 로드되어야 함 -->
  <script src="data/magazine-preview-data.js"></script>
  <script defer src="components/site-chrome.js"></script>
  <script defer src="components/site-font-switcher.js"></script>
  <script defer src="components/scroll-top.js"></script>
  <script>
    (function () {
      var ITEMS_PER_PAGE = 12;
      var currentPage = 1;
      var currentView = "thumb";
      var dataset = [];

      var INTERNAL_PREVIEW_DETAIL_BY_ID = {
        1: "magazine-preview-detail-01.html",
        2: "magazine-preview-detail-02.html",
        3: "magazine-preview-detail-03.html",
        4: "magazine-preview-detail-04.html",
        5: "magazine-preview-detail-05.html",
        6: "magazine-preview-detail-06.html",
        7: "magazine-preview-detail-07.html",
        8: "magazine-preview-detail-08.html",
        9: "magazine-preview-detail-09.html",
        10: "magazine-preview-detail-10.html",
        11: "magazine-preview-detail-11.html",
        12: "magazine-preview-detail-12.html",
        13: "magazine-preview-detail-13.html",
        14: "magazine-preview-detail-14.html",
        15: "magazine-preview-detail-15.html",
        16: "magazine-preview-detail-16.html",
        17: "magazine-preview-detail-17.html",
        18: "magazine-preview-detail-18.html",
        19: "magazine-preview-detail-19.html",
        20: "magazine-preview-detail-20.html",
        21: "magazine-preview-detail-21.html",
        22: "magazine-preview-detail-22.html",
        23: "magazine-preview-detail-23.html",
        24: "magazine-preview-detail-24.html"
      };

      function toInternalArticleHref(item) {
        if (!item || !item.id) return "";
        return INTERNAL_PREVIEW_DETAIL_BY_ID[item.id] || "";
      }

      function refreshDataset() {
        dataset = Array.isArray(window.MAGAZINE_PREVIEW_DATA) ? window.MAGAZINE_PREVIEW_DATA.slice() : [];
      }

      function ensureDatasetThenRender() {
        refreshDataset();
        if (!dataset.length) {
          window.setTimeout(function () {
            refreshDataset();
            renderCount();
            renderList();
            renderPagination();
          }, 0);
        }
      }

      function getTotalPages() {
        return Math.max(1, Math.ceil(dataset.length / ITEMS_PER_PAGE));
      }

      function getPageItems(page) {
        var start = (page - 1) * ITEMS_PER_PAGE;
        return dataset.slice(start, start + ITEMS_PER_PAGE);
      }

      function createPreviewItemElement(item) {
        var href = toInternalArticleHref(item);
        var article = document.createElement("article");
        article.className = "preview-item";

        var thumbLink = document.createElement("a");
        thumbLink.className = "preview-thumb-link";
        thumbLink.href = href;
        thumbLink.setAttribute("aria-label", item.title || "");

        var image = document.createElement("img");
        image.className = "preview-thumb";
        image.src = item.thumbnail || "";
        image.alt = (item.title || "") + " 썸네일";
        image.loading = "lazy";
        thumbLink.appendChild(image);

        var body = document.createElement("div");
        body.className = "preview-body";

        var titleLink = document.createElement("a");
        titleLink.className = "preview-title-link";
        titleLink.href = href;
        titleLink.textContent = item.title || "";

        var excerptLink = document.createElement("a");
        excerptLink.className = "preview-excerpt-link";
        excerptLink.href = href;
        excerptLink.textContent = item.excerpt || "";

        body.appendChild(titleLink);
        body.appendChild(excerptLink);

        article.appendChild(thumbLink);
        article.appendChild(body);
        return article;
      }

      function renderList() {
        var list = document.getElementById("previewList");
        list.classList.toggle("is-thumb", currentView === "thumb");
        list.classList.toggle("is-list", currentView === "list");
        list.innerHTML = "";
        getPageItems(currentPage).forEach(function (item) {
          list.appendChild(createPreviewItemElement(item));
        });
      }

      function renderPagination() {
        var total = getTotalPages();
        var nav = document.getElementById("pagination");
        var html = "";
        html += '<button type="button" class="page-btn" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? " disabled" : "") + ">이전</button>";
        for (var i = 1; i <= total; i++) {
          html += '<button type="button" class="page-btn' + (i === currentPage ? " is-active" : "") + '" data-page="' + i + '">' + i + "</button>";
        }
        html += '<button type="button" class="page-btn" data-page="' + (currentPage + 1) + '"' + (currentPage === total ? " disabled" : "") + ">다음</button>";
        nav.innerHTML = html;
      }

      function renderCount() {
        var count = document.getElementById("resultCount");
        count.textContent = "총 " + dataset.length + "건";
      }

      function bindEvents() {
        document.querySelectorAll(".mode-btn").forEach(function (button) {
          button.addEventListener("click", function () {
            var nextView = button.getAttribute("data-view");
            if (nextView === currentView) return;
            currentView = nextView;
            document.querySelectorAll(".mode-btn").forEach(function (btn) {
              var active = btn === button;
              btn.classList.toggle("is-active", active);
              btn.setAttribute("aria-selected", active ? "true" : "false");
            });
            renderList();
          });
        });

        document.getElementById("pagination").addEventListener("click", function (event) {
          var target = event.target.closest(".page-btn");
          if (!target || target.disabled) return;
          var page = Number(target.getAttribute("data-page") || 1);
          if (!page || page < 1 || page > getTotalPages() || page === currentPage) return;
          currentPage = page;
          renderList();
          renderPagination();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      function boot() {
        ensureDatasetThenRender();
        currentPage = 1;
        renderCount();
        renderList();
        renderPagination();
        bindEvents();
        initGnbMenu();
      }

      function initGnbMenu() {
        var gnbToggle = document.getElementById("gnbToggle");
        var gnbPanel = document.getElementById("gnb-panel");
        if (!gnbToggle || !gnbPanel) return;
        gnbToggle.addEventListener("click", function () {
          var open = gnbPanel.classList.toggle("is-open");
          gnbToggle.setAttribute("aria-expanded", open ? "true" : "false");
          gnbToggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
          if (!open) {
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
          }
        });
        gnbPanel.querySelectorAll(".gnb-depth2 a").forEach(function (anchor) {
          anchor.addEventListener("click", function () {
            if (!window.matchMedia("(max-width: 900px)").matches) return;
            gnbPanel.classList.remove("is-open");
            gnbToggle.setAttribute("aria-expanded", "false");
            gnbToggle.setAttribute("aria-label", "메뉴 열기");
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
          });
        });
        document.querySelectorAll(".gnb-item > .gnb-depth1").forEach(function (depth1) {
          depth1.addEventListener("click", function (event) {
            if (!window.matchMedia("(max-width: 900px)").matches) return;
            if (!gnbPanel.classList.contains("is-open")) return;
            var item = depth1.closest(".gnb-item");
            if (!item || !item.querySelector(".gnb-dropdown")) return;
            event.preventDefault();
            var wasOpen = item.classList.contains("is-open");
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
            if (!wasOpen) item.classList.add("is-open");
          });
        });
      }

      var needsSiteChrome = document.getElementById("site-header-mount") || document.getElementById("site-footer-mount");
      if (needsSiteChrome) {
        document.addEventListener("sitechrome:ready", boot, { once: true });
        document.addEventListener("sitechrome:error", boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
