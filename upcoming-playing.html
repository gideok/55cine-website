<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ti-nav-current" content="upcoming-playing.html" />
  <title>상영 예정작 — 테스트 UI · 55CINE</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/fonts-display.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/site-footer.css" />
  <link rel="stylesheet" href="css/page-pager.css" />
  <link rel="stylesheet" href="css/now-playing.css" />
</head>
<body class="ti">
  <div class="ti-shell" id="tiShell">
    <div class="ti-left">
      <div data-ti-mobile-menu-bar></div>
      <div class="ti-left-panel" id="tiLeftPanel">
        <div class="ti-left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="ti-footer ti-footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base=""
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="ti-right ti-np-root" aria-label="상영 예정작 본문">
      <div class="ti-np-scroll">
        <div class="np-page">
          <header class="np-head">
            <p class="np-kicker">상영작</p>
            <h1 class="np-title" id="np-page-title">상영 예정작</h1>
            <p class="np-sub">
              상영 일정이 확정된 예정작입니다. PC에서는 페이지를 나누어 보고, 모바일에서는 아래로 스크롤하면 이어서 불러옵니다.
            </p>
          </header>
          <div class="ti-page-toolbar">
            <p class="ti-page-count" id="npCount" aria-live="polite"></p>
            <nav class="ti-page-pager" id="npPager" aria-label="페이지"></nav>
          </div>
          <div class="np-grid" id="npGrid"></div>
          <p class="np-mobile-hint" id="npMobileHint">스크롤하면 다음 작품이 자동으로 불러와집니다.</p>
          <div class="np-sentinel" id="npSentinel" aria-hidden="true"></div>
          <p class="np-end" id="npEnd">모든 예정작을 불러왔습니다.</p>
        </div>
      </div>
    </aside>
    <footer
      class="ti-footer ti-footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base=""
      aria-label="사이트 정보"
    ></footer>
  </div>

  <script src="js/site-footer-include.js"></script>
  <script>
    window.TI_ASSET_BASE = "";
  </script>
  <script src="data/week-schedule-data.js"></script>
  <script>
    window.TI_MOVIE_LIST_PAGE_CONFIG = {
      dataUrl: "movies/now-playing/data/upcoming-list.json",
      detailUrlMode: "query",
      detailSection: "upcoming",
      emptyMessage: "표시할 예정작이 없습니다.",
      loadingMessage: "예정작 목록을 불러오는 중…",
      errorMessage: "예정작 목록을 표시할 수 없습니다."
    };
  </script>
  <script src="js/left-gnb-include.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/week-schedule.js"></script>
  <script src="js/page-pager.js"></script>
  <script src="js/movie-list-page.js"></script>
</body>
</html>
