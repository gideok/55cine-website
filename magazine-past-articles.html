<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ti-nav-current" content="magazine-past-articles.html" />
  <title>지난 기사 — 테스트 UI · 55CINE</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="components/site-common.css" />
  <link rel="stylesheet" href="css/components/section-page-head.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/fonts-display.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/site-footer.css" />
  <link rel="stylesheet" href="css/page-pager.css" />
  <link rel="stylesheet" href="css/magazine-preview.css" />
  <link rel="stylesheet" href="css/components/mz-thumb-stack.css" />
  <link rel="stylesheet" href="css/components/preview-list.css" />
  <link rel="stylesheet" href="css/carousel-chrome.css" />
</head>
<body class="ti">
  <div class="ti-shell" id="tiShell">
    <div class="ti-left">
      <div data-ti-mobile-menu-bar></div>
      <div class="ti-left-panel" id="tiLeftPanel">
        <div class="ti-left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="ti-footer ti-footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base=""
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="ti-right ti-mz-panel" aria-label="지난 기사 본문">
      <div class="ti-mz-scroll">
        <section class="preview-page" aria-labelledby="past-articles-page-title">
          <header class="section-page-head">
            <div class="section-page-head__row">
              <h1 id="past-articles-page-title" class="section-page-head__title">
                <span class="section-page-head__parent">매거진 삼삼오오</span><span class="section-page-head__sep" aria-hidden="true">·</span><span class="section-page-head__child">지난 기사</span>
              </h1>
              <nav class="section-page-subnav" aria-label="매거진 삼삼오오 하위 메뉴">
                <a href="magazine-preview.html">프리뷰</a>
                <a href="magazine-serial.html">연재</a>
                <a href="gv-moment.html">GV 모먼트</a>
                <a href="magazine-past-articles.html" class="is-current" aria-current="page">지난 기사</a>
              </nav>
            </div>
            <div class="section-page-head__rule" role="presentation"></div>
          </header>

          <div class="ti-page-toolbar">
            <div class="ti-page-toolbar__leading">
              <div class="view-mode" role="tablist" aria-label="목록 보기 방식">
                <button type="button" class="mode-btn is-active" data-view="thumb" role="tab" aria-selected="true" aria-label="썸네일형">
                  <img src="../images/ui/icon-view-thumb.svg" alt="" class="mode-btn__icon" width="18" height="18" decoding="async" />
                </button>
                <button type="button" class="mode-btn" data-view="list" role="tab" aria-selected="false" aria-label="목록형">
                  <img src="../images/ui/icon-view-list.svg" alt="" class="mode-btn__icon" width="18" height="18" decoding="async" />
                </button>
              </div>
              <p class="ti-page-count" id="pagerCount" aria-live="polite"></p>
            </div>
            <nav class="ti-page-pager" id="tiPagePager" aria-label="페이지"></nav>
          </div>

          <div id="mzThumbStack" class="mz-thumb-stack">
            <p class="se-hint" id="mzSwipeHint">좌우로 스와이프하여 페이지 이동</p>
            <div
              class="se-swipe-viewport"
              id="mzSwipeViewport"
              tabindex="0"
              role="region"
              aria-roledescription="캐러셀"
              aria-label="지난 기사 페이지. 좌우 스와이프로 전환"
            >
              <div class="se-swipe-track" id="mzSwipeTrack"></div>
            </div>
          </div>
          <div id="pastArticlesList" class="preview-list is-list" aria-live="polite" hidden></div>
          <footer class="se-foot mz-pager ti-pager-foot--mobile-only" aria-label="지난 기사 페이지네이션">
            <button type="button" class="se-page-btn" id="mzPagerPrev" aria-label="이전 페이지">이전</button>
            <span class="se-fraction" id="mzPagerFraction" aria-live="polite">1 / 1</span>
            <div class="se-page-dots" id="mzPagerDots" aria-hidden="true"></div>
            <button type="button" class="se-page-btn" id="mzPagerNext" aria-label="다음 페이지">다음</button>
          </footer>
        </section>
      </div>
    </aside>
    <footer
      class="ti-footer ti-footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base=""
      aria-label="사이트 정보"
    ></footer>
  </div>

  <script src="js/site-footer-include.js"></script>
  <script>
    window.TI_ASSET_BASE = "";
    window.MAGAZINE_PAST_ARTICLES_DATA = [];
  </script>
  <script src="data/week-schedule-data.js"></script>
  <script src="js/left-gnb-include.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/week-schedule.js"></script>
  <script>
    window.TI_MAGAZINE_CAROUSEL_CONFIG = {
      dataKey: "MAGAZINE_PAST_ARTICLES_DATA",
      listId: "pastArticlesList",
      itemClass: "preview-item",
      thumbLinkClass: "preview-thumb-link",
      thumbClass: "preview-thumb",
      bodyClass: "preview-body",
      titleLinkClass: "preview-title-link",
      excerptLinkClass: "preview-excerpt-link",
      showExcerptInList: true,
      useTitleWrap: false,
      thumbImgRatio: 9 / 16,
      fetchList: function () {
        return fetch("magazine/past-articles/data/index.json", { credentials: "same-origin" }).then(
          function (res) {
            if (!res.ok) throw new Error("지난 기사 목록을 불러오지 못했습니다.");
            return res.json();
          }
        ).then(function (payload) {
          return (payload.items || []).map(function (item) {
            return {
              id: item.id,
              title: item.title,
              excerpt: item.excerpt,
              thumbnail: item.thumbnail
            };
          });
        });
        /* API 연동 예시:
        return fetch("/api/magazine/past-articles").then(function (r) {
          if (!r.ok) throw new Error("지난 기사 목록을 불러오지 못했습니다.");
          return r.json();
        }).then(function (data) { return data.items; });
        */
      },
      resolveHref: function (item) {
        if (!item || !item.id) return "";
        return "magazine/past-articles/article-detail.html?id=" + encodeURIComponent(item.id);
      }
    };
  </script>
  <script src="js/page-pager.js"></script>
  <script src="js/carousel-dots.js"></script>
  <script src="js/magazine-carousel-page.js"></script>
</body>
</html>
