<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ti-nav-current" content="past-playing.html" />
  <title>지난 상영작 — 테스트 UI · 55CINE</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/fonts-display.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/components/shell-mobile-menu.css" />
  <link rel="stylesheet" href="css/components/shell-scroll-top.css" />
  <link rel="stylesheet" href="css/site-footer.css" />
  <link rel="stylesheet" href="css/page-pager.css" />
  <link rel="stylesheet" href="css/now-playing.css" />
  <link rel="stylesheet" href="css/components/np-movie-grid.css" />
  <link rel="stylesheet" href="css/components/np-search-toolbar.css" />
  <link rel="stylesheet" href="css/logo-spinner.css" />
</head>
<body class="ti">
  <div class="ti-shell" id="tiShell">
    <div class="ti-left">
      <div data-ti-mobile-menu-bar></div>
      <div class="ti-left-panel" id="tiLeftPanel">
        <div class="ti-left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="ti-footer ti-footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base=""
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="ti-right ti-np-root" aria-label="지난 상영작 본문">
      <div class="ti-np-scroll">
        <div class="np-page">
          <header class="np-head">
            <p class="np-kicker">상영작</p>
            <h1 class="np-title" id="np-page-title">지난 상영작</h1>
            <p class="np-sub">
              종료된 상영작 아카이브입니다. PC에서는 페이지를 나누어 보고, 모바일에서는 아래로 스크롤하면 이어서 불러옵니다.
            </p>
          </header>
          <div class="ti-page-toolbar">
            <p class="ti-page-count" id="npCount" aria-live="polite"></p>
            <div class="ti-page-toolbar__trailing">
              <div class="np-search" id="npSearch">
                <button
                  type="button"
                  class="np-search-toggle"
                  id="npSearchToggle"
                  aria-expanded="false"
                  aria-controls="npSearchPanel"
                  aria-label="검색 열기"
                >
                  <span class="np-search-toggle__icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75"/>
                      <path d="M16 16L20.5 20.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"/>
                    </svg>
                  </span>
                </button>
                <div class="np-search-panel" id="npSearchPanel">
                  <label class="np-search-field" for="npSearchInput">
                    <span class="np-search-icon" aria-hidden="true">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75"/>
                        <path d="M16 16L20.5 20.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"/>
                      </svg>
                    </span>
                    <input
                      type="search"
                      id="npSearchInput"
                      class="np-search-input"
                      placeholder="감독, 제목, 영어제목"
                      autocomplete="off"
                      aria-label="감독, 제목, 영어제목으로 검색"
                    />
                  </label>
                </div>
              </div>
              <nav class="ti-page-pager" id="npPager" aria-label="페이지"></nav>
            </div>
          </div>
          <div class="np-grid" id="npGrid"></div>
          <div class="np-load-more" id="npLoadMore" hidden aria-live="polite" aria-busy="false"></div>
          <p class="np-mobile-hint" id="npMobileHint">스크롤하면 다음 작품이 자동으로 불러와집니다.</p>
          <div class="np-sentinel" id="npSentinel" aria-hidden="true"></div>
          <p class="np-end" id="npEnd">모든 지난 상영작을 불러왔습니다.</p>
        </div>
      </div>
    </aside>
    <footer
      class="ti-footer ti-footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base=""
      aria-label="사이트 정보"
    ></footer>
  </div>

  <script src="js/site-footer-include.js"></script>
  <script>
    window.TI_ASSET_BASE = "";
  </script>
  <script src="data/week-schedule-data.js"></script>
  <script>
    window.TI_MOVIE_LIST_PAGE_CONFIG = {
      dataUrl: "movies/now-playing/data/past-list.json",
      detailUrlMode: "query",
      detailSection: "past",
      /* 조치필요(테스트스피너): 스피너 확인용 3초 지연 — 배포 전 제거 */
      testSpinnerDelayMs: 3000,
      emptyMessage: "표시할 지난 상영작이 없습니다.",
      loadingMessage: "지난 상영작 목록을 불러오는 중…",
      errorMessage: "지난 상영작 목록을 표시할 수 없습니다.",
      search: {
        enabled: true,
        placeholder: "감독, 제목, 영어제목",
        noResultsMessage: "검색 결과가 없습니다.",
        fields: ["titleKo", "titleEn", "director"]
      }
    };
  </script>
  <script src="js/left-gnb-include.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/week-schedule.js"></script>
  <script src="js/page-pager.js"></script>
  <script src="js/logo-spinner.js"></script>
  <script src="js/movie-list-page.js"></script>
</body>
</html>
