<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>55CINE - GV 모먼트</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="components/site-common.css" />
  <style>
    :root {
      --bg: #faf8f4;
      --bg-elevated: #fff;
      --text: #1c1610;
      --muted: #6b5d48;
      --line: #e8e2d6;
      --brand-ink: #1c1610;
      --brand-bronze: #8b6e3e;
      --brand-gold: #f0ab2a;
      --radius: 14px;
      --shadow: rgba(28, 22, 16, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--site-font-family);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    main { background: var(--bg-elevated); min-height: 100vh; }

    .gv-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }
    .page-title {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      font-weight: 700;
    }
    .result-count {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .gv-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .gv-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 12px var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .gv-thumb-link {
      display: block;
      line-height: 0;
      background: #ece7db;
    }
    .gv-thumb {
      width: 100%;
      aspect-ratio: 264 / 200;
      object-fit: cover;
      display: block;
    }
    .gv-title-wrap {
      padding: 12px 14px 14px;
      min-height: 72px;
    }
    .gv-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.42;
      color: var(--brand-ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .gv-title-link:hover .gv-title {
      color: var(--brand-bronze);
      text-decoration: underline;
    }
    .pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      padding: 0 10px;
    }
    .page-btn.is-active {
      background: var(--brand-gold);
      border-color: var(--brand-gold);
      color: var(--brand-ink);
    }
    .page-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .load-sentinel {
      height: 1px;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="site-header-mount"></div>
  <main>
    <section class="gv-page" aria-labelledby="gv-page-title">
      <div class="page-head">
        <h1 id="gv-page-title" class="page-title">GV 모먼트</h1>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div id="gvList" class="gv-list" aria-live="polite"></div>
      <nav id="pagination" class="pagination" aria-label="GV 모먼트 페이지네이션"></nav>
      <div id="loadSentinel" class="load-sentinel" aria-hidden="true"></div>
    </section>
  </main>
  <div id="site-footer-mount"></div>

  <script src="data/gv-moment-data.js"></script>
  <script defer src="components/site-chrome.js"></script>
  <script defer src="components/site-font-switcher.js"></script>
  <script defer src="components/scroll-top.js"></script>
  <script>
    (function () {
      var ITEMS_PER_PAGE = 12;
      var MOBILE_QUERY = window.matchMedia("(max-width: 900px)");
      var allItems = [];
      var currentPage = 1;
      var mobileLoadedCount = 0;
      var observer = null;

      function refreshData() {
        allItems = Array.isArray(window.GV_MOMENT_DATA) ? window.GV_MOMENT_DATA.slice() : [];
      }

      function getTotalPages() {
        return Math.max(1, Math.ceil(allItems.length / ITEMS_PER_PAGE));
      }

      function createCard(item) {
        var href = item.detailUrl || "";
        var article = document.createElement("article");
        article.className = "gv-item";

        var thumbLink = document.createElement("a");
        thumbLink.className = "gv-thumb-link";
        thumbLink.href = href;

        var image = document.createElement("img");
        image.className = "gv-thumb";
        image.src = item.thumbnail || "";
        image.alt = (item.title || "") + " 썸네일";
        image.loading = "lazy";
        thumbLink.appendChild(image);

        var titleWrap = document.createElement("div");
        titleWrap.className = "gv-title-wrap";
        var titleLink = document.createElement("a");
        titleLink.className = "gv-title-link";
        titleLink.href = href;
        var title = document.createElement("h2");
        title.className = "gv-title";
        title.textContent = item.title || "";
        titleLink.appendChild(title);
        titleWrap.appendChild(titleLink);

        article.appendChild(thumbLink);
        article.appendChild(titleWrap);
        return article;
      }

      function renderCount() {
        document.getElementById("resultCount").textContent = "총 " + allItems.length + "건";
      }

      function renderDesktopPage() {
        var list = document.getElementById("gvList");
        var start = (currentPage - 1) * ITEMS_PER_PAGE;
        var pageItems = allItems.slice(start, start + ITEMS_PER_PAGE);
        list.innerHTML = "";
        pageItems.forEach(function (item) {
          list.appendChild(createCard(item));
        });
      }

      function renderPagination() {
        var total = getTotalPages();
        var nav = document.getElementById("pagination");
        var html = "";
        html += '<button type="button" class="page-btn" data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? " disabled" : "") + ">이전</button>";
        for (var i = 1; i <= total; i++) {
          html += '<button type="button" class="page-btn' + (i === currentPage ? " is-active" : "") + '" data-page="' + i + '">' + i + "</button>";
        }
        html += '<button type="button" class="page-btn" data-page="' + (currentPage + 1) + '"' + (currentPage === total ? " disabled" : "") + ">다음</button>";
        nav.innerHTML = html;
      }

      function loadMoreMobile() {
        if (mobileLoadedCount >= allItems.length) return;
        var list = document.getElementById("gvList");
        var next = allItems.slice(mobileLoadedCount, mobileLoadedCount + ITEMS_PER_PAGE);
        next.forEach(function (item) {
          list.appendChild(createCard(item));
        });
        mobileLoadedCount += next.length;
      }

      function setupMobileInfiniteScroll() {
        var nav = document.getElementById("pagination");
        nav.style.display = "none";
        mobileLoadedCount = 0;
        document.getElementById("gvList").innerHTML = "";
        loadMoreMobile();
        if (observer) observer.disconnect();
        observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              loadMoreMobile();
            }
          });
        }, { rootMargin: "120px 0px" });
        observer.observe(document.getElementById("loadSentinel"));
      }

      function setupDesktopPagination() {
        var nav = document.getElementById("pagination");
        nav.style.display = "flex";
        if (observer) observer.disconnect();
        currentPage = 1;
        renderDesktopPage();
        renderPagination();
      }

      function bindPaginationEvents() {
        document.getElementById("pagination").addEventListener("click", function (event) {
          var button = event.target.closest(".page-btn");
          if (!button || button.disabled) return;
          var page = Number(button.getAttribute("data-page") || 1);
          if (!page || page < 1 || page > getTotalPages() || page === currentPage) return;
          currentPage = page;
          renderDesktopPage();
          renderPagination();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      function applyLayoutMode() {
        if (MOBILE_QUERY.matches) {
          setupMobileInfiniteScroll();
        } else {
          setupDesktopPagination();
        }
      }

      function initGnbMenu() {
        var gnbToggle = document.getElementById("gnbToggle");
        var gnbPanel = document.getElementById("gnb-panel");
        if (!gnbToggle || !gnbPanel) return;
        gnbToggle.addEventListener("click", function () {
          var open = gnbPanel.classList.toggle("is-open");
          gnbToggle.setAttribute("aria-expanded", open ? "true" : "false");
          gnbToggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
          if (!open) {
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
          }
        });
        document.querySelectorAll(".gnb-item > .gnb-depth1").forEach(function (depth1) {
          depth1.addEventListener("click", function (event) {
            if (!window.matchMedia("(max-width: 900px)").matches) return;
            if (!gnbPanel.classList.contains("is-open")) return;
            var item = depth1.closest(".gnb-item");
            if (!item || !item.querySelector(".gnb-dropdown")) return;
            event.preventDefault();
            var wasOpen = item.classList.contains("is-open");
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
            if (!wasOpen) item.classList.add("is-open");
          });
        });
      }

      function boot() {
        refreshData();
        renderCount();
        bindPaginationEvents();
        applyLayoutMode();
        MOBILE_QUERY.addEventListener("change", applyLayoutMode);
        initGnbMenu();
      }

      var needsSiteChrome = document.getElementById("site-header-mount") || document.getElementById("site-footer-mount");
      if (needsSiteChrome) {
        document.addEventListener("sitechrome:ready", boot, { once: true });
        document.addEventListener("sitechrome:error", boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
