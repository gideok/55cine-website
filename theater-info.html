<head>

  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="components/site-common.css" />
  <style>
    :root {
      --site-font-family: "Spoqa Han Sans Neo", sans-serif;
      --brand-gold: #f0ab2a;
      --brand-gold-mid: #ca9128;
      --brand-gold-soft: #f5d78a;
      --brand-bronze: #8b6e3e;
      --brand-bronze-deep: #5c4a2e;
      --brand-ink: #1c1610;
      --brand-walnut: #4a3d27;
      --bg: #faf8f4;
      --bg-elevated: #ffffff;
      --text: var(--brand-ink);
      --muted: #6b5d48;
      --line: #e8e2d6;
      --pill-bg: #f3efe6;
      --accent: var(--brand-gold);
      --shadow: rgba(28, 22, 16, 0.12);
      --radius: 15px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--site-font-family);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      background: var(--bg-elevated);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .btn-menu:hover {
      border-color: var(--brand-bronze);
      color: var(--brand-bronze-deep);
    }

    .page-theater {
      padding: 28px 24px 56px;
      max-width: 960px;
      margin: 0 auto;
    }

    .theater-lead-box {
      margin: 0 0 28px;
      padding: 24px 22px;
      border-radius: var(--radius);
      border: 1px solid color-mix(in srgb, var(--brand-gold) 28%, var(--line));
      background: linear-gradient(
        165deg,
        var(--bg-elevated) 0%,
        color-mix(in srgb, var(--pill-bg) 75%, var(--bg-elevated)) 55%,
        color-mix(in srgb, var(--brand-gold-soft) 15%, var(--pill-bg)) 100%
      );
      box-shadow: 0 8px 28px var(--shadow);
      text-align: center;
    }

    .theater-lead-box__eq {
      margin: 0 0 12px;
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--brand-walnut);
      font-variant-numeric: tabular-nums;
    }

    .theater-lead-box__tagline {
      margin: 0 0 8px;
      font-size: clamp(1.02rem, 2.8vw, 1.2rem);
      font-weight: 800;
      color: var(--brand-ink);
      line-height: 1.35;
    }

    .theater-lead-box__sub {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
    }

    .theater-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .theater-grid__item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-height: 100px;
      padding: 14px 14px 16px;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: linear-gradient(180deg, var(--bg-elevated) 0%, color-mix(in srgb, var(--pill-bg) 42%, var(--bg-elevated)) 100%);
      box-shadow: 0 4px 14px var(--shadow);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      color: var(--text);
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .theater-grid__item:hover {
      border-color: color-mix(in srgb, var(--brand-gold) 45%, var(--line));
      box-shadow: 0 8px 22px rgba(28, 22, 16, 0.14);
      transform: translateY(-2px);
    }

    .theater-grid__item:focus-visible {
      outline: 2px solid var(--brand-gold-mid);
      outline-offset: 3px;
    }

    .theater-grid__mark {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--brand-bronze-deep);
    }

    .theater-grid__title {
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.4;
      color: var(--brand-walnut);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    @media (max-width: 900px) {
      .theater-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 420px) {
      .theater-grid__item {
        min-height: 92px;
        padding: 12px;
      }
      .theater-grid__title {
        font-size: 0.82rem;
      }
    }

    body.theater-modal-open {
      overflow: hidden;
    }

    .theater-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .theater-modal[hidden] {
      display: none;
    }

    .theater-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(28, 22, 16, 0.45);
      backdrop-filter: blur(4px);
      cursor: pointer;
    }

    .theater-modal__panel {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      max-height: min(78vh, 640px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      box-shadow: 0 20px 60px rgba(28, 22, 16, 0.28);
    }

    .theater-modal__head {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--pill-bg) 35%, var(--bg-elevated));
    }

    .theater-modal__panel-title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--brand-walnut);
      word-break: keep-all;
    }

    .theater-modal__close {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -8px -6px 0 0;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .theater-modal__close:hover {
      background: color-mix(in srgb, var(--pill-bg) 100%, var(--line));
      color: var(--brand-ink);
    }

    .theater-modal__close:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 2px;
    }

    .theater-modal__body {
      margin: 0;
      padding: 16px 18px 22px;
      overflow-y: auto;
      font-size: 0.94rem;
      line-height: 1.65;
      color: color-mix(in srgb, var(--text) 94%, var(--muted));
    }

    /* 전면 로고 인트로 (video 또는 CSS 대체) */
    body.theater-intro-active {
      overflow: hidden;
    }

    .theater-intro-layer {
      position: fixed;
      inset: 0;
      z-index: 10001;
      background: #0e0c0a;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    .theater-intro-skip {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 2;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, #fff 35%, transparent);
      background: rgba(28, 22, 16, 0.55);
      color: #f5f0e8;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .theater-intro-skip:hover {
      background: rgba(28, 22, 16, 0.75);
    }

    .theater-intro-skip:focus-visible {
      outline: 2px solid var(--brand-gold);
      outline-offset: 3px;
    }

    .theater-intro-layer.theater-intro-layer--exit {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .theater-intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
    }

    .theater-intro-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse 120% 80% at 50% 40%, #2a2218 0%, #0e0c0a 55%, #050403 100%);
    }

    .theater-intro-fallback:not([hidden]) {
      display: flex;
    }

    .theater-intro-fallback__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: min(92vw, 420px);
    }

    .theater-intro-fallback:not([hidden]) .theater-intro-fallback__inner {
      animation: theaterIntroFallbackSeq 7.433s cubic-bezier(0.33, 0.11, 0.25, 1) forwards;
    }

    .theater-intro-fallback__logo {
      width: min(55vw, 220px);
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.45));
    }

    .theater-intro-fallback__brand {
      margin: 16px 0 0;
      font-size: clamp(1.55rem, 5vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(120deg, var(--brand-gold-soft) 0%, var(--brand-gold) 40%, var(--brand-gold-mid) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation: theaterIntroFallbackBrand 7.433s cubic-bezier(0.33, 0.11, 0.25, 1) forwards;
    }

    .theater-intro-fallback__tagline {
      margin: 10px 0 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: color-mix(in srgb, var(--pill-bg) 88%, #fff);
      letter-spacing: -0.02em;
      opacity: 0;
      animation: theaterIntroFallbackTagline 7.433s cubic-bezier(0.33, 0.11, 0.25, 1) forwards;
    }

    @keyframes theaterIntroFallbackSeq {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(12px);
        filter: blur(10px);
      }
      14% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
      78% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes theaterIntroFallbackBrand {
      0%,
      10% {
        opacity: 0;
        transform: translateY(10px);
      }
      22% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes theaterIntroFallbackTagline {
      0%,
      18% {
        opacity: 0;
        transform: translateY(8px);
      }
      30% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .theater-intro-fallback:not([hidden]) .theater-intro-fallback__inner,
      .theater-intro-fallback__brand,
      .theater-intro-fallback__tagline {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

<body>
  <div
    id="theaterIntroLayer"
    class="theater-intro-layer"
    role="dialog"
    aria-modal="true"
    aria-label="오오극장 로고 애니메이션"
    aria-live="polite"
  >
    <button type="button" class="theater-intro-skip" id="theaterIntroSkip">건너뛰기</button>
    <video
      id="theaterIntroVideo"
      class="theater-intro-video"
      src="logo-animation.mp4"
      playsinline
      muted
      preload="auto"
      title="오오극장 로고 애니메이션"
    ></video>
    <div id="theaterIntroFallback" class="theater-intro-fallback" hidden aria-hidden="true">
      <div class="theater-intro-fallback__inner">
        <img
          class="theater-intro-fallback__logo"
          src="images/logo.png"
          width="284"
          height="200"
          alt=""
          decoding="async"
        />
        <p class="theater-intro-fallback__brand">55CINE 오오극장</p>
        <p class="theater-intro-fallback__tagline">독립영화전용관</p>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var layer = document.getElementById("theaterIntroLayer");
      var video = document.getElementById("theaterIntroVideo");
      var fallback = document.getElementById("theaterIntroFallback");
      var skipBtn = document.getElementById("theaterIntroSkip");
      var FALLBACK_MS = 7433;
      var exitStarted = false;
      var fallbackTimer = null;
      var reduced =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function tearDownVideo() {
        if (!video) return;
        try {
          video.pause();
          video.removeAttribute("src");
          video.load();
        } catch (e) {}
      }

      function finishIntro() {
        if (exitStarted || !layer) return;
        if (fallbackTimer !== null) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        exitStarted = true;
        layer.classList.add("theater-intro-layer--exit");
        document.body.classList.remove("theater-intro-active");
        document.body.style.overflow = "";

        function cleanup() {
          layer.setAttribute("hidden", "");
          layer.setAttribute("aria-hidden", "true");
          tearDownVideo();
        }

        var done = false;
        var onEnd = function (e) {
          if (!e || (e.propertyName !== "opacity" && e.propertyName !== "visibility")) return;
          if (done) return;
          done = true;
          layer.removeEventListener("transitionend", onEnd);
          cleanup();
        };
        layer.addEventListener("transitionend", onEnd);
        window.setTimeout(function () {
          if (done) return;
          done = true;
          layer.removeEventListener("transitionend", onEnd);
          cleanup();
        }, 650);
      }

      if (!layer) return;

      if (reduced) {
        layer.setAttribute("hidden", "");
        layer.setAttribute("aria-hidden", "true");
        tearDownVideo();
        return;
      }

      document.body.classList.add("theater-intro-active");
      document.body.style.overflow = "hidden";

      if (skipBtn) {
        skipBtn.addEventListener("click", finishIntro);
      }

      document.addEventListener("keydown", function onIntroEscape(e) {
        if (e.key !== "Escape") return;
        if (exitStarted) return;
        if (layer.hasAttribute("hidden")) return;
        e.preventDefault();
        finishIntro();
      });

      var fallbackUsed = false;

      function showFallback() {
        if (fallbackUsed || !fallback) return;
        fallbackUsed = true;
        if (video) {
          video.style.display = "none";
        }
        fallback.removeAttribute("hidden");
        fallback.setAttribute("aria-hidden", "false");
        fallbackTimer = window.setTimeout(finishIntro, FALLBACK_MS);
      }

      if (video) {
        video.addEventListener("ended", finishIntro);
        video.addEventListener("error", showFallback);

        var playTry = video.play();
        if (playTry !== undefined && playTry.catch) {
          playTry.catch(function () {
            showFallback();
          });
        }

        window.setTimeout(function () {
          if (fallbackUsed) return;
          if (video.error || (video.readyState === 0 && video.networkState === 3)) {
            showFallback();
          }
        }, 1200);
      } else {
        showFallback();
      }
    })();
  </script>

            "오오극장은 커뮤니티 카페 ‘삼삼다방’을 함께 운영합니다. 이곳은 영화인과 관객이 자유롭게 교류하는 소통의 공간이자 세미나, 영화 감상 모임, 자유 토론 등이 이루어지는 열린 교육의 장입니다.",
        },
        {
          title: "취향의 공동체, 다채로운 기획전",
          body:
            "오오극장은 영화 장르만큼이나 다양한 취향이 존중되고 공존하는 공간입니다. 다큐멘터리, 애니메이션, 실험영화 등 폭넓은 프로그램을 통해 관객의 다양한 취향을 담아내는 기획전을 선보입니다.",
        },
        {
          title: "독립·자립·인디 예술과 함께하는 영화관",
          body:
            "오오극장은 영화예술을 넘어 지역의 독립·자립·인디 예술 공연과 전시가 펼쳐지는 대안적 복합문화공간입니다. 다양한 저변문화의 흐름을 접하고 예술가들과 만날 수 있는 연결의 장이 되고자 합니다.",
        },
        {
          title: "무한한 가능성의 자유로운 영화관",
          body:
            "오오극장은 예술의 본질인 표현의 자유를 최우선으로 존중합니다. 영화의 무한한 상상력과 가능성을 제한하는 어떠한 경계로부터도 자유로운 공간을 지향합니다.",
        },
        {
          title: "그리고 어떻게 성장할지 우리도 알 수 없는 영화관",
          body:
            "낡은 시네마테크와 작은 극장 구석에서 시작된 독립영화는 한국 영화의 중요한 토양이 되어 왔습니다. 오오극장은 대구 중구 수동에서 작은 시작을 내딛지만 대구를 넘어 한국 영화문화의 발전에 의미 있는 밑거름이 되도록 꾸준히 성장해 나가겠습니다.",
        },
      ];

      var grid = document.getElementById("theaterFeatureGrid");
      var modal = document.getElementById("theaterModal");
      var modalBackdrop = modal && modal.querySelector("[data-theater-modal-backdrop]");
      var modalTitle = document.getElementById("theaterModalTitle");
      var modalBody = document.getElementById("theaterModalBody");
      var modalClose = document.getElementById("theaterModalClose");
      var lastFocus = null;

      function openModal(index) {
        var item = THEATER_FEATURES[index];
        if (!item || !modal || !modalTitle || !modalBody) return;
        lastFocus = document.activeElement;
        modalTitle.textContent = "+" + (index + 1) + ". " + item.title;
        modalBody.textContent = item.body;
        modal.hidden = false;
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("theater-modal-open");
        modalClose.focus();
      }

      function closeModal() {
        if (!modal) return;
        modal.hidden = true;
        modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("theater-modal-open");
        if (lastFocus && typeof lastFocus.focus === "function") {
          lastFocus.focus();
        }
        lastFocus = null;
      }

      if (grid) {
        THEATER_FEATURES.forEach(function (item, i) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "theater-grid__item";
          btn.setAttribute("aria-haspopup", "dialog");
          var mark = document.createElement("span");
          mark.className = "theater-grid__mark";
          mark.textContent = "+" + (i + 1) + ".";
          var title = document.createElement("span");
          title.className = "theater-grid__title";
          title.textContent = item.title;
          btn.appendChild(mark);
          btn.appendChild(title);
          btn.addEventListener("click", function () {
            openModal(i);
          });
          grid.appendChild(btn);
        });
      }

      if (modalBackdrop) {
        modalBackdrop.addEventListener("click", closeModal);
      }
      if (modalClose) {
        modalClose.addEventListener("click", closeModal);
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal && !modal.hidden) {
          closeModal();
        }
      });

      function initGnb() {
        var gnbToggle = document.getElementById("gnbToggle");
        var gnbPanel = document.getElementById("gnb-panel");
        if (gnbToggle && gnbPanel) {
          gnbToggle.addEventListener("click", function () {
            var open = gnbPanel.classList.toggle("is-open");
            gnbToggle.setAttribute("aria-expanded", open ? "true" : "false");
            gnbToggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
            if (!open) {
              gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
                li.classList.remove("is-open");
              });
            }
          });
          gnbPanel.querySelectorAll(".gnb-depth2 a").forEach(function (a) {
            a.addEventListener("click", function () {
              if (window.matchMedia("(max-width: 900px)").matches) {
                gnbPanel.classList.remove("is-open");
                gnbToggle.setAttribute("aria-expanded", "false");
                gnbToggle.setAttribute("aria-label", "메뉴 열기");
                gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
                  li.classList.remove("is-open");
                });
              }
            });
          });
        }

        document.querySelectorAll(".gnb-item > .gnb-depth1").forEach(function (depth1) {
          depth1.addEventListener("click", function (e) {
            if (!window.matchMedia("(max-width: 900px)").matches) return;
            var panel = document.getElementById("gnb-panel");
            if (!panel || !panel.classList.contains("is-open")) return;
            var item = depth1.closest(".gnb-item");
            if (!item || !item.querySelector(".gnb-dropdown")) return;
            e.preventDefault();
            var wasOpen = item.classList.contains("is-open");
            document.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
            if (!wasOpen) item.classList.add("is-open");
          });
        });
      }

      var needsSiteChrome = document.getElementById("site-header-mount") || document.getElementById("site-footer-mount");
      if (needsSiteChrome) {
        document.addEventListener("sitechrome:ready", initGnb, { once: true });
        document.addEventListener("sitechrome:error", initGnb, { once: true });
      } else {
        initGnb();
      }
    })();
  </script>
</body>
</html>
