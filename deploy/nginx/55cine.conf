# 55cine 운영 사이트 — /etc/nginx/sites-available/55cine.conf
# HTTPS: Let's Encrypt (certbot). 인증서 경로가 없으면 HTTP만 동작.
# 캐노니컬 호스트: https://55cine.com

# HTTP — ACME 검증 + HTTPS(apex) 리다이렉트
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 55cine.com www.55cine.com _;

    root /var/www/55cine;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/55cine;
        allow all;
    }

    location / {
        return 301 https://55cine.com$request_uri;
    }
}

# HTTPS www → apex 301
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.55cine.com;

    ssl_certificate /etc/letsencrypt/live/55cine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/55cine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://55cine.com$request_uri;
}

# HTTPS apex (캐노니컬)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 55cine.com;

    ssl_certificate /etc/letsencrypt/live/55cine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/55cine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (1년, 서브도메인 포함). HTTPS만 응답하므로 preload 준비에 적합.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/55cine;
    index index.html;

    client_max_body_size 25m;

    # Dynamic sitemap / robots (Fastify)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/api/v1/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000/api/v1/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 정적 파일
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fastify API (로컬 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 업로드 이미지 (관리자)
    location /images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
