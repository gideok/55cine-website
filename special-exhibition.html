<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/site-root.js"></script>
  <meta name="ti-nav-current" content="special-exhibition.html" />
  <title>기획전 — 테스트 · 55CINE 오오극장</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/fonts-display.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/components/shell-mobile-menu.css" />
  <link rel="stylesheet" href="css/components/shell-scroll-top.css" />
  <link rel="stylesheet" href="css/site-footer.css" />
  <link rel="stylesheet" href="css/page-pager.css" />
  <link rel="stylesheet" href="css/exhibition.css" />
  <link rel="stylesheet" href="css/exhibition-grid-lines.css" />
  <link rel="stylesheet" href="css/carousel-chrome.css" />
  <link rel="stylesheet" href="css/now-playing.css" />
  <link rel="stylesheet" href="css/components/np-search-toolbar.css" />
  <link rel="stylesheet" href="css/logo-spinner.css" />
</head>
<body class="ti">
  <div class="shell" id="tiShell">
    <div class="left">
      <div data-ti-mobile-menu-bar></div>
      <div class="left-panel" id="tiLeftPanel">
        <div class="left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="footer footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base=""
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="right se-right np-list" aria-label="기획전 목록">
      <div class="se-right-inner" id="seRightInner">
        <header class="np-head se-head">
          <h1 class="np-title se-title-page" id="special-page-title">기획전</h1>
        </header>
        <div class="np-meta-row np-meta-row--with-search">
          <div class="np-meta" id="tiPageCount" aria-live="polite"></div>
          <div class="np-search" id="seSearch"></div>
        </div>
        <p class="se-hint" id="seSwipeHint">좌우로 스와이프하여 페이지 이동</p>
        <div
          class="se-swipe-viewport"
          id="seSwipeViewport"
          tabindex="0"
          role="region"
          aria-roledescription="캐러셀"
          aria-label="기획전 페이지. 좌우 스와이프로 전환"
        >
          <div class="se-swipe-track" id="seSwipeTrack"></div>
        </div>
        <footer class="se-foot pager-foot--mobile-only">
          <button type="button" class="se-page-btn" id="sePrev" aria-label="이전 페이지">이전</button>
          <span class="se-fraction" id="seFraction" aria-live="polite">1 / 1</span>
          <div class="se-page-dots" id="seDots" aria-hidden="true"></div>
          <button type="button" class="se-page-btn" id="seNext" aria-label="다음 페이지">다음</button>
        </footer>
        <nav class="page-pager page-pager--bottom" id="tiPagePager" aria-label="페이지"></nav>
      </div>
    </aside>
    <footer
      class="footer footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base=""
      aria-label="사이트 정보"
    ></footer>
  </div>
  <script src="js/site-footer-include.js"></script>
  <!-- TI_ASSET_BASE: js/site-root.js -->
    <script src="js/api/client.js"></script>
<script src="data/week-schedule-data.js"></script>
  <script src="data/now-playing-data.js"></script>
  <script src="js/page-pager.js"></script>
  <script src="js/carousel-dots.js"></script>
  <script src="js/logo-spinner.js"></script>
  <script src="js/thumb-grid-layout.js"></script>
  <script src="js/list-search-ui.js"></script>
  <script src="js/exhibition-carousel.js"></script>
  <script src="js/left-gnb-include.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/week-schedule.js"></script>
</body>
</html>
