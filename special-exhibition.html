<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ti-nav-current" content="special-exhibition.html" />
  <title>기획전 — 테스트 · 55CINE 오오극장</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/ti-fonts.css" />
  <link rel="stylesheet" href="css/ti-fonts-display.css" />
  <link rel="stylesheet" href="css/ti-shell.css" />
  <link rel="stylesheet" href="css/ti-site-footer.css" />
  <link rel="stylesheet" href="css/ti-page-pager.css" />
  <link rel="stylesheet" href="css/ti-exhibition.css" />
  <link rel="stylesheet" href="css/ti-exhibition-grid-lines.css" />
  <link rel="stylesheet" href="css/ti-carousel-chrome.css" />
</head>
<body class="ti">
  <div class="ti-shell" id="tiShell">
    <div class="ti-left">
      <div data-ti-mobile-menu-bar></div>
      <div class="ti-left-panel" id="tiLeftPanel">
        <div class="ti-left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="ti-footer ti-footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base=""
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="ti-right se-right" aria-label="기획전 목록">
      <div class="se-right-inner" id="seRightInner">
        <header class="se-head">
          <h1 class="se-title-page" id="special-page-title">기획전</h1>
        </header>
        <div class="ti-page-toolbar">
          <p class="ti-page-count" id="tiPageCount" aria-live="polite"></p>
          <nav class="ti-page-pager" id="tiPagePager" aria-label="페이지"></nav>
        </div>
        <p class="se-hint" id="seSwipeHint">좌우로 스와이프하여 페이지 이동</p>
        <div
          class="se-swipe-viewport"
          id="seSwipeViewport"
          tabindex="0"
          role="region"
          aria-roledescription="캐러셀"
          aria-label="기획전 페이지. 좌우 스와이프로 전환"
        >
          <div class="se-swipe-track" id="seSwipeTrack"></div>
        </div>
        <footer class="se-foot ti-pager-foot--mobile-only">
          <button type="button" class="se-page-btn" id="sePrev" aria-label="이전 페이지">이전</button>
          <span class="se-fraction" id="seFraction" aria-live="polite">1 / 1</span>
          <div class="se-page-dots" id="seDots" aria-hidden="true"></div>
          <button type="button" class="se-page-btn" id="seNext" aria-label="다음 페이지">다음</button>
        </footer>
      </div>
    </aside>
    <footer
      class="ti-footer ti-footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base=""
      aria-label="사이트 정보"
    ></footer>
  </div>

  <script src="js/ti-site-footer-include.js"></script>
  <script>
    window.TI_ASSET_BASE = "";
  </script>
  <script src="data/week-schedule-data.js"></script>
  <script src="data/now-playing-data.js"></script>
  <script src="data/special-program-data.js"></script>
  <script src="js/ti-page-pager.js"></script>
  <script src="js/ti-carousel-dots.js"></script>
  <script src="js/ti-exhibition-carousel.js"></script>
  <script src="js/ti-left-gnb-include.js"></script>
  <script src="js/ti-mobile-menu.js"></script>
  <script src="js/ti-scroll-top.js"></script>
  <script src="js/ti-week-schedule.js"></script>
</body>
</html>
