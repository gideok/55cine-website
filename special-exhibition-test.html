        overflow: hidden;
        max-height: 2800px;

        transition:

          border-color 0.32s ease;
      }

      .ti-shell.ti-menu-collapsed-mobile .ti-left-panel {
        max-height: 0;
        opacity: 0;
        border-bottom: none;
        pointer-events: none;
      }

      .ti-shell.ti-menu-collapsed-mobile .ti-left {
        border-bottom: 1px solid #bdbdbd;
      }
    }

    @media (min-width: 821px) {
      .ti-shell.ti-menu-collapsed-mobile .ti-left-panel {
        max-height: none;
        opacity: 1;
        pointer-events: auto;
      }

      .ti-shell.ti-menu-collapsed-mobile .ti-hamburger__glyph {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }

      .se-swipe-viewport {
        scroll-behavior: auto;
      }

      .ti-hamburger__glyph {
        transition: none !important;
      }

      .ti-left-panel {
        transition: none !important;
      }
    }

  <script>
    (function () {
      var GRID_GAP_PX = 10;
      var POSTER_ASPECT = 740 / 510;
      var TITLE_BLOCK_RESERVE_PX = 62;
      var MAX_ROWS = 16;
      var COL_BREAKPOINT = window.matchMedia("(max-width: 820px)");

      var viewport = document.getElementById("seSwipeViewport");
      var track = document.getElementById("seSwipeTrack");
      var rightInner = document.getElementById("seRightInner");
      var resultCountEl = document.getElementById("resultCount");
      var fractionEl = document.getElementById("seFraction");
      var dotsEl = document.getElementById("seDots");
      var btnPrev = document.getElementById("sePrev");
      var btnNext = document.getElementById("seNext");
      var hintEl = document.getElementById("seSwipeHint");

      if (!viewport || !track) return;

      var dataset = [];
      var itemsPerPage = 8;
      var totalPages = 1;
      var activePage = 0;
      var scrollEndTimer;
      var layoutTimer;

      function refreshDataset() {
        dataset = Array.isArray(window.SPECIAL_PROGRAM_DATA) ? window.SPECIAL_PROGRAM_DATA.slice() : [];
      }

      function getGridColumns() {
        return COL_BREAKPOINT.matches ? 2 : 4;
      }

      function computeItemsPerPage() {
        var cols = getGridColumns();
        var h = viewport.clientHeight;
        var w = viewport.clientWidth;
        if (w < 40 || h < 40) {
          return Math.max(cols * 2, cols);
        }
        var cellW = (w - GRID_GAP_PX * Math.max(0, cols - 1)) / cols;
        var rowH = cellW * POSTER_ASPECT + TITLE_BLOCK_RESERVE_PX;
        var rows = Math.floor((h + GRID_GAP_PX) / (rowH + GRID_GAP_PX));
        rows = Math.max(1, Math.min(MAX_ROWS, rows));
        return rows * cols;
      }

      function getTotalPages() {
        return Math.max(1, Math.ceil(dataset.length / itemsPerPage));
      }

      function getPageItems(pageIndex) {
        var start = pageIndex * itemsPerPage;
        return dataset.slice(start, start + itemsPerPage);
      }

      function createCard(item) {
        var href = item.detailUrl || item.sourceUrl || "#";
        var article = document.createElement("article");
        article.className = "se-card";

        var thumbLink = document.createElement("a");
        thumbLink.className = "se-thumb-link";
        thumbLink.href = href;

        var image = document.createElement("img");
        image.className = "se-thumb";
        image.src = item.thumbnail || "";
        image.alt = (item.title || "") + " 썸네일";
        image.loading = "lazy";
        thumbLink.appendChild(image);

        var titleWrap = document.createElement("div");
        titleWrap.className = "se-title-wrap";

        var titleLink = document.createElement("a");
        titleLink.className = "se-title-link";
        titleLink.href = href;

        var title = document.createElement("h2");
        title.className = "se-item-title";
        title.textContent = item.title || "";

        titleLink.appendChild(title);
        titleWrap.appendChild(titleLink);

        article.appendChild(thumbLink);
        article.appendChild(titleWrap);
        return article;
      }

      function buildSlides() {
        track.innerHTML = "";
        totalPages = getTotalPages();
        for (var p = 0; p < totalPages; p++) {
          var slide = document.createElement("div");
          slide.className = "se-slide";
          slide.setAttribute("role", "group");
          slide.setAttribute("aria-label", "페이지 " + (p + 1) + " / " + totalPages);

          var grid = document.createElement("div");
          grid.className = "se-grid";

          getPageItems(p).forEach(function (item) {
            grid.appendChild(createCard(item));
          });

          slide.appendChild(grid);
          track.appendChild(slide);
        }
      }

      function updateDots() {
        dotsEl.innerHTML = "";
        for (var i = 0; i < totalPages; i++) {
          var dot = document.createElement("button");
          dot.type = "button";
          dot.className = "se-dot" + (i === activePage ? " is-active" : "");
          dot.setAttribute("aria-label", "페이지 " + (i + 1));
          dot.addEventListener(
            "click",
            (function (page) {
              return function () {
                goToPage(page);
              };
            })(i)
          );
          dotsEl.appendChild(dot);
        }
      }

      function updateChrome() {
        fractionEl.textContent = totalPages ? activePage + 1 + " / " + totalPages : "0 / 0";
        btnPrev.disabled = activePage <= 0;
        btnNext.disabled = activePage >= totalPages - 1;
        updateDots();
      }

      function readActivePageFromScroll() {
        var w = viewport.clientWidth;
        if (w <= 0) return 0;
        var idx = Math.round(viewport.scrollLeft / w);
        return Math.max(0, Math.min(totalPages - 1, idx));
      }

      function syncActiveFromScroll() {
        var next = readActivePageFromScroll();
        if (next !== activePage) {
          activePage = next;
          updateChrome();
        }
      }

      function goToPage(pageIndex) {
        pageIndex = Math.max(0, Math.min(totalPages - 1, pageIndex));
        activePage = pageIndex;
        var w = viewport.clientWidth;
        viewport.scrollTo({ left: pageIndex * w, behavior: "smooth" });
        updateChrome();
      }

      function applyLayoutFromViewport() {
        refreshDataset();
        var cols = getGridColumns();
        var nextIpp = computeItemsPerPage();
        if (nextIpp < cols) nextIpp = cols;

        var prevIpp = itemsPerPage;
        var itemOffset = activePage * prevIpp;
        var ippChanged = nextIpp !== prevIpp;
        itemsPerPage = nextIpp;

        var newTotal = Math.max(1, Math.ceil(dataset.length / itemsPerPage));
        activePage = Math.floor(itemOffset / itemsPerPage);
        if (activePage >= newTotal) activePage = newTotal - 1;
        if (activePage < 0) activePage = 0;

        if (ippChanged || track.childElementCount === 0) {
          buildSlides();
        }

        var w = viewport.clientWidth;
        viewport.scrollLeft = activePage * w;
        updateChrome();

        if (hintEl) {
          hintEl.hidden = totalPages <= 1;
        }
      }

      function scheduleLayout() {
        clearTimeout(layoutTimer);
        layoutTimer = setTimeout(function () {
          requestAnimationFrame(applyLayoutFromViewport);
        }, 48);
      }

      function boot() {
        refreshDataset();
        if (resultCountEl) {
          resultCountEl.textContent = "총 " + dataset.length + "건";
        }
        activePage = 0;
        itemsPerPage = getGridColumns();
        requestAnimationFrame(function () {
          requestAnimationFrame(applyLayoutFromViewport);
        });
      }

      viewport.addEventListener("scroll", function () {
        clearTimeout(scrollEndTimer);
        scrollEndTimer = setTimeout(syncActiveFromScroll, 120);
      });

      viewport.addEventListener("scrollend", syncActiveFromScroll);

      btnPrev.addEventListener("click", function () {
        goToPage(activePage - 1);
      });
      btnNext.addEventListener("click", function () {
        goToPage(activePage + 1);
      });

      viewport.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          goToPage(activePage - 1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          goToPage(activePage + 1);
        }
      });

      window.addEventListener(
        "resize",
        function () {
          scheduleLayout();
        },
        { passive: true }
      );

      if (rightInner && typeof ResizeObserver !== "undefined") {
        var ro = new ResizeObserver(function () {
          scheduleLayout();
        });
        ro.observe(rightInner);
      }

      function onColBreakpointChange() {
        scheduleLayout();
      }

      if (COL_BREAKPOINT.addEventListener) {
        COL_BREAKPOINT.addEventListener("change", onColBreakpointChange);
      } else if (COL_BREAKPOINT.addListener) {
        COL_BREAKPOINT.addListener(onColBreakpointChange);
      }

      window.addEventListener("special-exhibition-test:relayout", function () {
        scheduleLayout();
      });

      boot();
    })();
  </script>

  <script>
    (function () {
      var shell = document.getElementById("tiShell");
      var btn = document.getElementById("tiHamburger");
      var mq = window.matchMedia("(max-width: 820px)");
      if (!shell || !btn) return;

      function requestRelayout() {
        window.dispatchEvent(new CustomEvent("special-exhibition-test:relayout"));
      }

      function clearCollapsedOnDesktop() {
        if (!mq.matches) {
          shell.classList.remove("ti-menu-collapsed-mobile");
          btn.setAttribute("aria-expanded", "true");
        }
      }

      btn.addEventListener("click", function () {
        if (!mq.matches) return;
        var nowCollapsed = shell.classList.toggle("ti-menu-collapsed-mobile");
        btn.setAttribute("aria-expanded", nowCollapsed ? "false" : "true");
        btn.setAttribute(
          "aria-label",
          nowCollapsed ? "메뉴·시간표 펼치기" : "메뉴·시간표 접기"
        );
        requestAnimationFrame(function () {
          requestRelayout();
        });
        setTimeout(requestRelayout, 480);
      });

      btn.setAttribute("aria-label", "메뉴·시간표 접기");

      window.addEventListener(
        "resize",
        function () {
          clearCollapsedOnDesktop();
        },
        { passive: true }
      );

      if (mq.addEventListener) {
        mq.addEventListener("change", clearCollapsedOnDesktop);
      } else if (mq.addListener) {
        mq.addListener(clearCollapsedOnDesktop);
      }
    })();
  </script>

      var MOVIE_POSTER_BY_TITLE = {
        르누아르: "images/movie001.jpg",
        "빨간 나리를 보았니": "images/movie001.jpg",
        "세계의 주인": "images/movie002.jpg",
        "극장의 시간들": "images/movie003.jpg",
        "극장의 시간들 (중영)": "images/movie003.jpg",
        "힌드의 목소리": "images/movie004.jpg",
        "새벽의 Tango": "images/movie001.jpg",
        누륵: "images/movie002.jpg",
        "센티멘탈 밸류": "images/movie003.jpg",
        "센티멘탈 밸류 (중영)": "images/movie003.jpg",
        주의에게: "images/movie004.jpg",
        "그녀가 돌아온 날 (개봉)": "images/movie001.jpg",
        "달갈 원정대 (개봉)": "images/movie002.jpg"
      };

      function movieDetailUrlForPoster(posterUrl) {
        if (posterUrl.indexOf("movie001.jpg") !== -1) return "movie-detail.html";
        if (posterUrl.indexOf("movie002.jpg") !== -1) return "movie-detail-type2.html";
        return "";
      }

      function parseMovieTitleWithStatus(title) {
        var suffixMatch = title.match(/\s*\((개봉|종영|중영)\)\s*$/);
        if (!suffixMatch) {
          return { cleanTitle: title, badgeLabel: "", badgeClass: "" };
        }
        var rawStatus = suffixMatch[1];
        var badgeLabel = rawStatus === "중영" ? "종영" : rawStatus;
        return {
          cleanTitle: title.replace(/\s*\((개봉|종영|중영)\)\s*$/, ""),
          badgeLabel: badgeLabel
        };
      }

      var dayTabs = document.getElementById("tiDayTabs");
      var panelsWrap = document.getElementById("tiSchedulePanels");
      if (!dayTabs || !panelsWrap) return;

      var todayWeekdayLabel = WEEKDAY_LABELS[new Date().getDay()];
      var defaultIndex = Math.max(
        0,
        WEEK_SCHEDULE.findIndex(function (day) {
          return day.weekday === todayWeekdayLabel;
        })
      );

      WEEK_SCHEDULE.forEach(function (day, i) {
        var tab = document.createElement("button");
        tab.type = "button";
        tab.className = "ti-day-tab";
        tab.setAttribute("role", "tab");
        tab.id = "ti-tab-day-" + i;
        tab.setAttribute("aria-controls", "ti-panel-day-" + i);
        tab.textContent = day.label;
        tab.setAttribute("aria-selected", i === defaultIndex ? "true" : "false");
        dayTabs.appendChild(tab);

        var panel = document.createElement("div");
        panel.className = "ti-panel" + (i === defaultIndex ? " is-active" : "");
        panel.id = "ti-panel-day-" + i;
        panel.setAttribute("role", "tabpanel");
        panel.setAttribute("aria-labelledby", "ti-tab-day-" + i);
        panel.hidden = i !== defaultIndex;

        day.entries.forEach(function (entry, entryIndex) {
          var titleInfo = parseMovieTitleWithStatus(entry.title);
          var poster =
            MOVIE_POSTER_BY_TITLE[entry.title] ||
            MOVIE_POSTER_BY_TITLE[titleInfo.cleanTitle] ||
            MOVIE_IMAGES[entryIndex % MOVIE_IMAGES.length];
          var detailUrl = movieDetailUrlForPoster(poster);

          var row = document.createElement("div");
          row.className = "ti-row";

          var slot = document.createElement("span");
          slot.className = "ti-slot";
          slot.setAttribute("aria-label", entryIndex + 1 + "회차");
          slot.textContent = String(entryIndex + 1);

          var img = document.createElement("img");
          img.className = "ti-poster";
          img.src = poster;
          img.alt = entry.title + " 포스터";
          img.width = 40;
          img.height = 40;

          var titleWrap = document.createElement("span");
          titleWrap.className = "ti-title";
          var titleText = document.createElement("span");
          titleText.className = "ti-title-text";
          if (detailUrl) {
            var la = document.createElement("a");
            la.href = detailUrl;
            la.textContent = titleInfo.cleanTitle;
            titleText.appendChild(la);
          } else {
            titleText.textContent = titleInfo.cleanTitle;
          }
          titleWrap.appendChild(titleText);
          if (titleInfo.badgeLabel) {
            var badge = document.createElement("span");
            badge.className = "ti-badge";
            badge.textContent = titleInfo.badgeLabel;
            titleWrap.appendChild(badge);
          }

          var timeEl = document.createElement("span");
          timeEl.className = "ti-time";
          timeEl.textContent = entry.time;

          var book = document.createElement("button");
          book.type = "button";
          book.className = "ti-book";
          book.setAttribute("aria-label", entry.title + " " + entry.time + " 예매하기");

          var posterWrap = detailUrl ? document.createElement("a") : document.createElement("span");

          row.appendChild(slot);
          row.appendChild(posterWrap);
          row.appendChild(titleWrap);
          row.appendChild(timeEl);
