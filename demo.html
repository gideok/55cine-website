<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>55CINE — Demo</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Asta+Sans:wght@400;500;600;700&family=Do+Hyeon&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin />
  <link rel="stylesheet" href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSans-kr.css" />
  <style>
    /*
     * 컬러 팔레트: images/logo.png 에서 불투명 픽셀 k-means(5) 추출 후
     * 대표색 보정 — 골드 #F0AB2A · 브론즈 #8B6E3E · 딥 월넛 #4A3D27
     */
    :root {
      --site-font-family: "Noto Sans KR", system-ui, sans-serif;
      --brand-gold: #f0ab2a;
      --brand-gold-mid: #ca9128;
      --brand-gold-soft: #f5d78a;
      --brand-bronze: #8b6e3e;
      --brand-bronze-deep: #5c4a2e;
      --brand-ink: #1c1610;
      --brand-walnut: #4a3d27;
      --bg: #faf8f4;
      --bg-elevated: #ffffff;
      --text: var(--brand-ink);
      --muted: #6b5d48;
      --line: #e8e2d6;
      --pill-bg: #f3efe6;
      --accent: var(--brand-gold);
      --accent-hover: #d99920;
      --accent-secondary: var(--brand-bronze);
      --tab-active: var(--brand-ink);
      --tab-inactive-bg: #ede8de;
      --tab-inactive-text: #7a6e5c;
      --menu-card: #f3efe6;
      --shadow: rgba(28, 22, 16, 0.12);
      --shadow-deep: rgba(28, 22, 16, 0.35);
      --radius: 15px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--site-font-family);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .header-brand-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      flex-shrink: 0;
      min-width: 0;
    }

    .font-test-select-wrap {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .font-test-select {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      max-width: min(168px, 38vw);
    }

    .font-test-select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    main {
      background: var(--bg-elevated);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header + GNB (1차 가로 · 2차 hover 드롭다운, cinecube 스타일 참고) */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 14px 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.25;
      flex-shrink: 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    .btn-menu {
      margin-left: auto;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--pill-bg);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-menu:hover {
      border-color: var(--brand-bronze);
      color: var(--brand-bronze-deep);
    }

    .gnb-panel {
      flex: 1 0 100%;
      border-top: 1px solid var(--line);
      margin: 0 -24px;
      padding: 0 24px;
      background: color-mix(in srgb, var(--bg-elevated) 96%, transparent);
    }

    .gnb {
      font-size: 0.95rem;
    }

    .gnb-depth1-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 20px;
    }

    .gnb-item {
      position: relative;
      margin: 0;
      padding: 0;
    }

    .gnb-depth1 {
      display: block;
      font-weight: 500;
      color: var(--text);
      padding: 8px 2px;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .gnb-depth1:hover {
      color: var(--accent);
    }

    .gnb-item:hover > .gnb-depth1,
    .gnb-item:focus-within > .gnb-depth1 {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .gnb-dropdown {
      position: absolute;
      left: 0;
      top: calc(100% + 0px);
      padding-top: 6px;
      min-width: 200px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity 0.18s ease, visibility 0.18s ease, transform 0.18s ease;
      z-index: 120;
      pointer-events: none;
    }

    .gnb-dropdown-inner {
      margin: 0;
      padding: 8px 0;
      list-style: none;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: 0 12px 40px var(--shadow);
    }

    .gnb-depth2 a {
      display: block;
      padding: 10px 18px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text);
      white-space: nowrap;
    }

    .gnb-depth2 a:hover {
      background: color-mix(in srgb, var(--pill-bg) 85%, var(--bg-elevated));
      color: var(--brand-bronze-deep);
    }

    .gnb-depth2 a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    @media (min-width: 901px) {
      .header-top {
        flex-wrap: nowrap;
      }

      .btn-menu {
        display: none;
      }

      .gnb-panel {
        flex: 0 1 auto;
        flex-basis: auto;
        margin-left: auto;
        margin-right: 0;
        padding: 0;
        border-top: none;
        background: transparent;
      }

      .gnb-panel,
      .gnb-panel.is-open {
        display: block !important;
      }

      .gnb-item:hover > .gnb-dropdown,
      .gnb-item:focus-within > .gnb-dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        pointer-events: auto;
      }

      .gnb-item:last-child .gnb-dropdown {
        left: auto;
        right: 0;
      }
    }

    @media (max-width: 900px) {
      .gnb-panel {
        display: none;
        margin-top: 4px;
      }

      .gnb-panel.is-open {
        display: block;
      }

      .gnb-depth1-list {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 4px 0 12px;
      }

      .gnb-item {
        border-bottom: 1px solid var(--line);
      }

      .gnb-item:last-child {
        border-bottom: none;
      }

      .gnb-depth1 {
        white-space: normal;
        padding: 12px 4px;
      }

      .gnb-item.is-open > .gnb-depth1 {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .gnb-dropdown {
        position: static;
        padding-top: 0;
        opacity: 0;
        visibility: hidden;
        max-height: 0;
        overflow: hidden;
        transform: none;
        transition: max-height 0.25s ease, opacity 0.2s ease, visibility 0.2s ease;
        pointer-events: none;
      }

      .gnb-item.is-open > .gnb-dropdown {
        opacity: 1;
        visibility: visible;
        max-height: 480px;
        padding-bottom: 8px;
        pointer-events: auto;
      }

      .gnb-dropdown-inner {
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0 0 4px 12px;
        background: transparent;
      }

      .gnb-depth2 a {
        padding: 8px 12px;
        white-space: normal;
      }
    }

    /* Hero Carousel */
    .hero {
      padding: 20px 24px 32px;
      background: linear-gradient(180deg, var(--pill-bg) 0%, var(--bg-elevated) 100%);
    }

    .carousel-wrap {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 32px var(--shadow);
      background: var(--brand-ink);
      touch-action: pan-y pinch-zoom;
      cursor: grab;
    }

    .carousel-wrap.is-dragging {
      cursor: grabbing;
      user-select: none;
      touch-action: none;
    }

    .carousel-wrap.is-dragging .carousel-slide img {
      pointer-events: none;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.45s ease;
    }

    .carousel-slide {
      flex: 0 0 100%;
      min-height: 280px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .slide-nowplaying {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      padding: 24px;
      width: 100%;
      background: linear-gradient(160deg, #2a2318 0%, var(--brand-ink) 55%, #0f0c09 100%);
    }

    .slide-nowplaying figure {
      margin: 0;
      text-align: center;
    }

    .slide-nowplaying img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 20px var(--shadow-deep);
    }

    .slide-nowplaying figcaption {
      margin-top: 8px;
      font-size: 0.8rem;
      color: color-mix(in srgb, var(--brand-gold-soft) 75%, transparent);
    }

    .slide-poster-link {
      display: block;
      color: inherit;
      text-decoration: none;
      border-radius: var(--radius-sm);
    }

    .slide-poster-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .slide-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      color: #fff;
      text-align: center;
    }

    .slide-placeholder strong {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .slide-placeholder p {
      margin: 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    .slide-booking {
      background: linear-gradient(135deg, var(--brand-bronze) 0%, var(--brand-bronze-deep) 100%);
    }

    .slide-timetable {
      background: linear-gradient(135deg, #3a3228 0%, var(--brand-ink) 55%, #15120e 100%);
    }

    .slide-event {
      background: linear-gradient(125deg, var(--brand-gold) 0%, var(--brand-gold-mid) 42%, var(--brand-bronze) 100%);
    }

    .slide-event.slide-placeholder {
      color: var(--brand-ink);
      text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-elevated) 35%, transparent);
    }

    .slide-event.slide-placeholder p {
      opacity: 0.9;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 14px 0 0;
    }

    .carousel-dots button {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      background: color-mix(in srgb, var(--brand-bronze) 35%, #fff);
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, transform 0.2s;
    }

    .carousel-dots button[aria-current="true"] {
      background: var(--accent);
      transform: scale(1.15);
    }

    .carousel-arrows {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      pointer-events: none;
    }

    .carousel-arrows button {
      pointer-events: auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .carousel-arrows button:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Main 시간표 */
    .section-timetable {
      padding: 8px 24px 40px;
      max-width: 960px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::after {
      content: "›";
      font-weight: 400;
      color: var(--muted);
    }

    .ref-note {
      font-size: 0.75rem;
      color: var(--muted);
      margin: -8px 0 16px;
    }

    .day-tabs-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 20px;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .day-tabs-wrap::-webkit-scrollbar {
      height: 6px;
    }

    .day-tabs-wrap::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--brand-bronze) 45%, var(--line));
      border-radius: 3px;
    }

    .day-tabs {
      display: inline-flex;
      gap: 8px;
      padding: 4px;
      min-width: min-content;
    }

    .day-tab {
      flex-shrink: 0;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--tab-inactive-bg);
      color: var(--tab-inactive-text);
      transition: background 0.2s, color 0.2s;
    }

    .day-tab:hover {
      background: color-mix(in srgb, var(--brand-gold-soft) 55%, var(--tab-inactive-bg));
      color: var(--brand-ink);
    }

    .day-tab[aria-selected="true"] {
      background: var(--tab-active);
      color: #fffef8;
    }

    .day-tab[aria-selected="true"]:hover {
      background: var(--brand-walnut);
      color: #fffef8;
    }

    .schedule-panel {
      display: none;
    }

    .schedule-panel.is-active {
      display: block;
    }

    .schedule-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .schedule-row:last-child {
      border-bottom: none;
    }

    .slot-label {
      flex: 0 0 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      line-height: 1;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-elevated);
    }

    .poster-badge {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--bg-elevated);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .movie-title {
      flex: 1;
      min-width: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .movie-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-status-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 700;
      line-height: 1.4;
      border: 1px solid transparent;
    }

    .movie-status-badge--open {
      background: color-mix(in srgb, var(--brand-gold) 20%, var(--bg-elevated));
      color: var(--brand-walnut);
      border-color: color-mix(in srgb, var(--brand-gold) 55%, transparent);
    }

    .movie-status-badge--end {
      background: color-mix(in srgb, var(--brand-bronze) 18%, var(--bg-elevated));
      color: var(--brand-bronze-deep);
      border-color: color-mix(in srgb, var(--brand-bronze) 45%, transparent);
    }

    .time-pill {
      margin-left: auto;
      padding: 10px 16px;
      background: var(--pill-bg);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .booking-btn {
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--accent);
      color: var(--brand-ink);
      font-size: 0.84rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .booking-btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px var(--shadow);
      transform: translateY(-1px);
    }

    .booking-btn:focus-visible {
      outline: 2px solid var(--brand-walnut);
      outline-offset: 2px;
    }

    .schedule-poster-link {
      flex-shrink: 0;
      line-height: 0;
      border-radius: 50%;
      outline-offset: 3px;
    }

    .schedule-poster-link:focus-visible {
      outline: 2px solid var(--accent);
    }

    .schedule-poster-link .poster-badge {
      display: block;
    }

    .movie-title-link {
      color: inherit;
      font: inherit;
      font-weight: inherit;
      text-decoration: none;
      min-width: 0;
    }

    .movie-title-link.movie-title-text {
      display: inline-block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }

    .movie-title-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .movie-title-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Menu cards */
    .section-menu {
      padding: 16px 24px 48px;
      max-width: 960px;
      margin: 0 auto;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      background: var(--menu-card);
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      text-align: left;
      width: 100%;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow);
      border: 1px solid color-mix(in srgb, var(--brand-bronze) 28%, transparent);
    }

    .menu-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .menu-card .icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      stroke: var(--brand-bronze);
      fill: none;
      stroke-width: 1.8;
    }

    .menu-card:hover .icon {
      stroke: var(--brand-bronze-deep);
    }

    /* Footer */
    .site-footer {
      padding: 32px 24px 40px;
      background: color-mix(in srgb, var(--brand-bronze-deep) 8%, var(--pill-bg));
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .site-footer .biz {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: stretch;
      gap: 18px;
    }

    .footer-logo-box {
      flex-shrink: 0;
      align-self: stretch;
      display: block;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      line-height: 0;
      border-radius: 2px;
      background: whitesmoke;
      overflow: hidden;
      /* 높이: .footer-text와 동일(flex stretch). 가로: 그 높이에서 526:948 비율로 필요한 표시 폭(원본 픽셀 폭이 아님) */
      aspect-ratio: 526 / 948;
      width: auto;
      max-width: none;
      height: auto;
    }

    .footer-logo-box img {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      object-fit: contain;
    }

    .footer-text {
      flex: 1;
      min-width: 0;
    }

    .site-footer strong {
      color: var(--brand-walnut);
      font-weight: 600;
    }

    .copyright {
      margin-top: 20px;
      padding-top: 16px;

  <script defer src="components/site-chrome.js"></script>

  <script>
    (function () {
      function runDemoApp() {
      const gnbToggle = document.getElementById("gnbToggle");
      const gnbPanel = document.getElementById("gnb-panel");
      if (gnbToggle && gnbPanel) {
        gnbToggle.addEventListener("click", function () {
          var open = gnbPanel.classList.toggle("is-open");
          gnbToggle.setAttribute("aria-expanded", open ? "true" : "false");
          gnbToggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
          if (!open) {
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
          }
        });
        gnbPanel.querySelectorAll(".gnb-depth2 a").forEach(function (a) {
          a.addEventListener("click", function () {
            if (window.matchMedia("(max-width: 900px)").matches) {
              gnbPanel.classList.remove("is-open");
              gnbToggle.setAttribute("aria-expanded", "false");
              gnbToggle.setAttribute("aria-label", "메뉴 열기");
              gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
                li.classList.remove("is-open");
              });
            }
          });
        });
      }

      document.querySelectorAll(".gnb-item > .gnb-depth1").forEach(function (depth1) {
        depth1.addEventListener("click", function (e) {
          if (!window.matchMedia("(max-width: 900px)").matches) return;
          var panel = document.getElementById("gnb-panel");
          if (!panel || !panel.classList.contains("is-open")) return;
          var item = depth1.closest(".gnb-item");
          if (!item || !item.querySelector(".gnb-dropdown")) return;
          e.preventDefault();
          var wasOpen = item.classList.contains("is-open");
          document.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
            li.classList.remove("is-open");
          });
          if (!wasOpen) item.classList.add("is-open");
        });
      });

      const MOVIE_IMAGES = [
        "images/movie001.jpg",
        "images/movie002.jpg",
        "images/movie003.jpg",
        "images/movie004.jpg"
      ];
      const WEEKDAY_LABELS = ["일", "월", "화", "수", "목", "금", "토"];

      /* Carousel */
      const track = document.getElementById("carouselTrack");
      const carouselWrap = track.parentElement;
      const dotsWrap = document.getElementById("carouselDots");
      const slides = track.querySelectorAll(".carousel-slide");
      let slideIndex = 0;
      let carouselTimer = null;

      function pauseCarouselAuto() {
        if (carouselTimer) {
          clearInterval(carouselTimer);
          carouselTimer = null;
        }
      }

      function resumeCarouselAutoIfAllowed() {
        if (carouselWrap.matches(":hover")) return;
        pauseCarouselAuto();
        carouselTimer = setInterval(function () { goTo(slideIndex + 1); }, 6000);
      }

      slides.forEach(function (_, i) {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "tab");
        b.setAttribute("aria-label", "슬라이드 " + (i + 1));
        b.addEventListener("click", function () { goTo(i); });
        dotsWrap.appendChild(b);
      });

      const dots = dotsWrap.querySelectorAll("button");

      function goTo(i) {
        slideIndex = (i + slides.length) % slides.length;
        track.style.transform = "translateX(-" + slideIndex * 100 + "%)";
        dots.forEach(function (d, j) {
          d.setAttribute("aria-current", j === slideIndex ? "true" : "false");
        });
      }

      document.getElementById("carouselPrev").addEventListener("click", function () {
        goTo(slideIndex - 1);
      });
      document.getElementById("carouselNext").addEventListener("click", function () {
        goTo(slideIndex + 1);
      });

      goTo(0);
      resumeCarouselAutoIfAllowed();

      carouselWrap.addEventListener("mouseenter", pauseCarouselAuto);
      carouselWrap.addEventListener("mouseleave", resumeCarouselAutoIfAllowed);

      /* PC: 마우스 드래그 · 모바일: 터치 스와이프 (Pointer Events) */
      var SWIPE_THRESHOLD_PX = 48;
      var dragPointerId = null;
      var dragStartX = 0;
      var dragLastX = 0;
      var dragActive = false;

      function onCarouselPointerDown(e) {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        if (e.target.closest && e.target.closest(".carousel-arrows button")) return;
        dragPointerId = e.pointerId;
        dragStartX = dragLastX = e.clientX;
        dragActive = true;
        pauseCarouselAuto();
        track.style.transition = "none";
        carouselWrap.classList.add("is-dragging");
        try {
          carouselWrap.setPointerCapture(e.pointerId);
        } catch (err) {}
      }

      function onCarouselPointerMove(e) {
        if (!dragActive || e.pointerId !== dragPointerId) return;
        dragLastX = e.clientX;
        var w = carouselWrap.offsetWidth || 1;
        var pct = -slideIndex * 100 + ((dragLastX - dragStartX) / w) * 100;
        track.style.transform = "translateX(" + pct + "%)";
        if (e.pointerType === "touch" && Math.abs(dragLastX - dragStartX) > 8) {
          e.preventDefault();
        }
      }

      function onCarouselPointerUp(e) {
        if (!dragActive || e.pointerId !== dragPointerId) return;
        var dx = dragLastX - dragStartX;
        dragActive = false;
        dragPointerId = null;
        track.style.transition = "";
        carouselWrap.classList.remove("is-dragging");
        try {
          carouselWrap.releasePointerCapture(e.pointerId);
        } catch (err2) {}
        if (Math.abs(dx) >= SWIPE_THRESHOLD_PX) {
          if (dx < 0) goTo(slideIndex + 1);
          else goTo(slideIndex - 1);
        } else {
          goTo(slideIndex);
        }
        resumeCarouselAutoIfAllowed();
      }

      carouselWrap.addEventListener("pointerdown", onCarouselPointerDown);
      carouselWrap.addEventListener("pointermove", onCarouselPointerMove, { passive: false });
      carouselWrap.addEventListener("pointerup", onCarouselPointerUp);
      carouselWrap.addEventListener("pointercancel", onCarouselPointerUp);

      /* 이번 주 시간표: 제공 이미지 기준 정적 데이터 */
      const WEEK_SCHEDULE = [
        {
          label: "4/30(목)",
          weekday: "목",
          entries: [
            { time: "11:30", title: "빨간 나리를 보았니" },
            { time: "13:50", title: "세계의 주인" },
            { time: "16:15", title: "극장의 시간들" },
            { time: "18:20", title: "힌드의 목소리" },
            { time: "20:05", title: "새벽의 Tango" }
          ]
        },
        {
          label: "5/1(금)",
          weekday: "금",
          entries: [
            { time: "11:30", title: "누륵" },
            { time: "13:10", title: "센티멘탈 밸류" },
            { time: "14:00", title: "르누아르" },
            { time: "15:40", title: "힌드의 목소리" },
            { time: "17:25", title: "새벽의 Tango" },
            { time: "19:40", title: "세계의 주인" }
          ]
        },
        {
          label: "5/2(토)",
          weekday: "토",
          entries: [
            { time: "11:30", title: "세계의 주인" },
            { time: "13:45", title: "힌드의 목소리" },
            { time: "15:30", title: "새벽의 Tango" },
            { time: "17:45", title: "센티멘탈 밸류" },
            { time: "20:15", title: "누륵" }
          ]
        },
        {
          label: "5/3(일)",
          weekday: "일",
          entries: [
            { time: "11:30", title: "새벽의 Tango" },
            { time: "13:45", title: "센티멘탈 밸류" },
            { time: "16:15", title: "힌드의 목소리" },
            { time: "18:00", title: "세계의 주인" },
            { time: "20:15", title: "주의에게" }
          ]
        },
        {
          label: "5/4(월)",
          weekday: "월",
          entries: [
            { time: "11:30", title: "주의에게" },
            { time: "13:30", title: "누륵" },
            { time: "15:10", title: "새벽의 Tango" },
            { time: "17:25", title: "빨간 나리를 보았니" },
            { time: "19:40", title: "극장의 시간들 (중영)" }
          ]
        },
        {
          label: "5/5(화)",
          weekday: "화",
          entries: [
            { time: "11:30", title: "누륵" },
            { time: "13:10", title: "새벽의 Tango" },
            { time: "15:25", title: "힌드의 목소리" },
            { time: "17:10", title: "센티멘탈 밸류 (중영)" },
            { time: "19:40", title: "세계의 주인" }
          ]
        },
        {
          label: "5/6(수)",
          weekday: "수",
          entries: [
            { time: "11:15", title: "새벽의 Tango" },
            { time: "13:30", title: "세계의 주인" },
            { time: "15:45", title: "누륵" },
            { time: "17:30", title: "그녀가 돌아온 날 (개봉)" },
            { time: "19:15", title: "달갈 원정대 (개봉)" }
          ]
        }
      ];

      function movieDetailUrlForPoster(posterUrl) {
        if (posterUrl.indexOf("movie001.jpg") !== -1) return "movie-detail.html";
        if (posterUrl.indexOf("movie002.jpg") !== -1) return "movie-detail-type2.html";
        return "";
      }

      const MOVIE_POSTER_BY_TITLE = {
        "르누아르": "images/movie001.jpg",
        "빨간 나리를 보았니": "images/movie001.jpg",
        "세계의 주인": "images/movie002.jpg",
        "극장의 시간들": "images/movie003.jpg",
        "극장의 시간들 (중영)": "images/movie003.jpg",
        "힌드의 목소리": "images/movie004.jpg",
        "새벽의 Tango": "images/movie001.jpg",
        "누륵": "images/movie002.jpg",
        "센티멘탈 밸류": "images/movie003.jpg",
        "센티멘탈 밸류 (중영)": "images/movie003.jpg",
        "주의에게": "images/movie004.jpg",
        "그녀가 돌아온 날 (개봉)": "images/movie001.jpg",
        "달갈 원정대 (개봉)": "images/movie002.jpg"
      };

      function parseMovieTitleWithStatus(title) {
        const suffixMatch = title.match(/\s*\((개봉|종영|중영)\)\s*$/);
        if (!suffixMatch) {
          return { cleanTitle: title, badgeLabel: "", badgeClass: "" };
        }
        const rawStatus = suffixMatch[1];
        const badgeLabel = rawStatus === "중영" ? "종영" : rawStatus;
        const badgeClass = badgeLabel === "개봉" ? "movie-status-badge--open" : "movie-status-badge--end";
        return {
          cleanTitle: title.replace(/\s*\((개봉|종영|중영)\)\s*$/, ""),
          badgeLabel: badgeLabel,
          badgeClass: badgeClass
        };
      }

      const dayTabs = document.getElementById("dayTabs");
      const panelsWrap = document.getElementById("schedulePanels");
      const todayWeekdayLabel = WEEKDAY_LABELS[new Date().getDay()];
      const defaultIndex = Math.max(0, WEEK_SCHEDULE.findIndex(function (day) {
        return day.weekday === todayWeekdayLabel;
      }));

      WEEK_SCHEDULE.forEach(function (day, i) {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "day-tab";
        tab.setAttribute("role", "tab");
        tab.id = "tab-day-" + i;
        tab.setAttribute("aria-controls", "panel-day-" + i);
        tab.textContent = day.label;
        tab.setAttribute("aria-selected", i === defaultIndex ? "true" : "false");
        dayTabs.appendChild(tab);

        const panel = document.createElement("div");
        panel.className = "schedule-panel" + (i === defaultIndex ? " is-active" : "");
        panel.id = "panel-day-" + i;
        panel.setAttribute("role", "tabpanel");
        panel.setAttribute("aria-labelledby", "tab-day-" + i);
        panel.hidden = i !== defaultIndex;

        day.entries.forEach(function (entry, entryIndex) {
          const row = document.createElement("div");
          row.className = "schedule-row";
          const titleInfo = parseMovieTitleWithStatus(entry.title);
          const poster = MOVIE_POSTER_BY_TITLE[entry.title] || MOVIE_POSTER_BY_TITLE[titleInfo.cleanTitle] || MOVIE_IMAGES[entryIndex % MOVIE_IMAGES.length];
          const badgeHtml = titleInfo.badgeLabel
            ? '<span class="movie-status-badge ' + titleInfo.badgeClass + '">' + titleInfo.badgeLabel + "</span>"
            : "";
          var detailUrl = movieDetailUrlForPoster(poster);
          var posterInner = '<img class="poster-badge" src="' + poster + '" alt="' + entry.title + ' 포스터" width="52" height="52" />';
          var posterBlock = detailUrl
            ? '<a class="schedule-poster-link" href="' + detailUrl + '">' + posterInner + "</a>"
            : posterInner;
          var titleBlock = detailUrl
            ? '<a class="movie-title-link movie-title-text" href="' + detailUrl + '">' + titleInfo.cleanTitle + "</a>"
            : '<span class="movie-title-text">' + titleInfo.cleanTitle + "</span>";
          row.innerHTML =
            '<span class="slot-label" aria-label="' + (entryIndex + 1) + '회차">' + (entryIndex + 1) + "</span>" +
            posterBlock +
            '<span class="movie-title">' + titleBlock + badgeHtml + "</span>" +
            '<span class="time-pill">' + entry.time + "</span>" +
            '<button type="button" class="booking-btn" aria-label="' + entry.title + " " + entry.time + ' 예매하기">예매</button>';
          panel.appendChild(row);
        });
        panelsWrap.appendChild(panel);

        tab.addEventListener("click", function () {
          dayTabs.querySelectorAll(".day-tab").forEach(function (t) {
            t.setAttribute("aria-selected", "false");
          });
          tab.setAttribute("aria-selected", "true");
          panelsWrap.querySelectorAll(".schedule-panel").forEach(function (p, idx) {
            const active = idx === i;
            p.classList.toggle("is-active", active);
            p.hidden = !active;
          });
        });
      });

      /* 초기 포커스: 오늘 탭이 보이도록 스크롤 */
      const selected = dayTabs.querySelector('[aria-selected="true"]');
      if (selected) {
        selected.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
      }

      var needsSiteChrome = document.getElementById("site-header-mount") || document.getElementById("site-footer-mount");
      if (needsSiteChrome) {
        document.addEventListener("sitechrome:ready", runDemoApp, { once: true });
        document.addEventListener("sitechrome:error", runDemoApp, { once: true });
      } else {
        runDemoApp();
      }
    })();
  </script>
