<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../js/site-root.js"></script>
  <title>관리자 로그인 — 55CINE</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body admin-body--login">
  <div class="admin-layout admin-layout--login">
    <aside class="admin-sidebar" aria-label="관리자">
      <div class="admin-sidebar__brand">55CINE 관리자</div>
      <p class="admin-login-sidebar__note">관리자 계정으로 로그인하세요.</p>
    </aside>
    <main class="admin-main admin-main--login">
      <h1 class="admin-page-title">로그인</h1>
      <p class="admin-login-lead">관리자 계정으로 로그인하세요.</p>
      <form id="adminLoginForm" class="admin-form admin-login-form">
        <div class="field">
          <label for="adminLoginId">아이디</label>
          <input type="text" id="adminLoginId" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="adminLoginPassword">비밀번호</label>
          <input type="password" id="adminLoginPassword" name="password" autocomplete="current-password" required />
        </div>
        <p id="adminLoginError" class="admin-msg admin-msg--error" hidden role="alert"></p>
        <div class="admin-form-actions admin-login-form__actions">
          <button type="submit" class="admin-btn admin-btn--primary" id="adminLoginSubmit">로그인</button>
        </div>
      </form>
      <p class="admin-login-foot">
        <a class="admin-login-foot__link" href="../index.html">← 사이트 홈으로</a>
      </p>
    </main>
  </div>
  <script src="../js/api/client.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/login-page.js"></script>
</body>
</html>
