<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ti-nav-current" content="gv-moment-test.html" />
  <title>GV 모먼트 — 테스트 UI · 55CINE</title>
  <link rel="icon" href="../favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../components/site-common.css" />
  <link rel="stylesheet" href="css/test-ti-fonts.css" />
  <link rel="stylesheet" href="css/test-ti-fonts-display.css" />
  <link rel="stylesheet" href="css/test-ti-shell.css" />
  <link rel="stylesheet" href="css/test-ti-site-footer.css" />
  <link rel="stylesheet" href="css/test-ti-magazine-preview.css" />
  <link rel="stylesheet" href="css/test-ti-magazine-list-pages.css" />
</head>
<body class="ti">
  <div class="ti-shell" id="tiShell">
    <div class="ti-left">
      <div data-ti-mobile-menu-bar></div>
      <div class="ti-left-panel" id="tiLeftPanel">
        <div class="ti-left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="ti-footer ti-footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base="../"
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="ti-right ti-mz-panel" aria-label="GV 모먼트 본문">
      <div class="ti-mz-scroll">
        <section class="preview-page" aria-labelledby="gv-page-title">
          <header class="section-page-head">
            <div class="section-page-head__row">
              <h1 id="gv-page-title" class="section-page-head__title">
                <span class="section-page-head__parent">매거진 삼삼오오</span><span class="section-page-head__sep" aria-hidden="true">·</span><span class="section-page-head__child">GV 모먼트</span>
              </h1>
              <nav class="section-page-subnav" aria-label="매거진 삼삼오오 하위 메뉴">
                <a href="magazine-preview-test.html">프리뷰</a>
                <a href="magazine-serial-test.html">연재</a>
                <a href="gv-moment-test.html" class="is-current" aria-current="page">GV 모먼트</a>
                <a href="#" class="is-placeholder" tabindex="-1" aria-disabled="true">지난 기사</a>
              </nav>
            </div>
            <div class="section-page-head__rule" role="presentation"></div>
            <div class="section-page-head__meta">
              <span class="result-count" id="resultCount"></span>
            </div>
          </header>
          <div id="gvList" class="gv-list" aria-live="polite"></div>
          <nav id="pagination" class="pagination" aria-label="GV 모먼트 페이지네이션"></nav>
          <div id="loadSentinel" class="load-sentinel" aria-hidden="true"></div>
        </section>
      </div>
    </aside>
    <footer
      class="ti-footer ti-footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base="../"
      aria-label="사이트 정보"
    ></footer>
  </div>

  <script src="js/test-ti-site-footer-include.js"></script>
  <script>
    window.TEST_TI_ASSET_BASE = "../";
  </script>
  <script src="../data/week-schedule-data.js"></script>
  <script src="../data/now-playing-data.js"></script>
  <script src="../data/gv-moment-data.js"></script>
  <script src="js/test-ti-left-gnb-include.js"></script>
  <script src="js/test-ti-mobile-menu.js"></script>
  <script src="js/test-ti-scroll-top.js"></script>
  <script src="js/test-ti-week-schedule.js"></script>
  <script>
    (function () {
      var SITE_ROOT_PREFIX = "../";
      var ITEMS_PER_PAGE = 12;
      var MOBILE_QUERY = window.matchMedia("(max-width: 900px)");
      var allItems = [];
      var currentPage = 1;
      var mobileLoadedCount = 0;
      var observer = null;

      function resolveFromSiteRoot(path) {
        if (!path) return "";
        if (/^https?:\/\//i.test(path)) return path;
        return SITE_ROOT_PREFIX + path.replace(/^\//, "");
      }

      function scrollContentToTop() {
        var scrollEl = document.querySelector(".ti-mz-scroll");
        if (scrollEl) {
          scrollEl.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      function refreshData() {
        allItems = Array.isArray(window.GV_MOMENT_DATA) ? window.GV_MOMENT_DATA.slice() : [];
      }

      function getTotalPages() {
        return Math.max(1, Math.ceil(allItems.length / ITEMS_PER_PAGE));
      }

      function createCard(item) {
        var href = resolveFromSiteRoot(item.detailUrl || "");
        var article = document.createElement("article");
        article.className = "gv-item";

        var thumbLink = document.createElement("a");
        thumbLink.className = "gv-thumb-link";
        thumbLink.href = href;

        var image = document.createElement("img");
        image.className = "gv-thumb";
        image.src = resolveFromSiteRoot(item.thumbnail || "");
        image.alt = (item.title || "") + " 썸네일";
        image.loading = "lazy";
        thumbLink.appendChild(image);

        var titleWrap = document.createElement("div");
        titleWrap.className = "gv-title-wrap";
        var titleLink = document.createElement("a");
        titleLink.className = "gv-title-link";
        titleLink.href = href;
        var title = document.createElement("h2");
        title.className = "gv-title";
        title.textContent = item.title || "";
        titleLink.appendChild(title);
        titleWrap.appendChild(titleLink);

        article.appendChild(thumbLink);
        article.appendChild(titleWrap);
        return article;
      }

      function renderCount() {
        document.getElementById("resultCount").textContent = "총 " + allItems.length + "건";
      }

      function renderDesktopPage() {
        var list = document.getElementById("gvList");
        var start = (currentPage - 1) * ITEMS_PER_PAGE;
        var pageItems = allItems.slice(start, start + ITEMS_PER_PAGE);
        list.innerHTML = "";
        pageItems.forEach(function (item) {
          list.appendChild(createCard(item));
        });
      }

      function renderPagination() {
        var total = getTotalPages();
        var nav = document.getElementById("pagination");
        var html = "";
        html +=
          '<button type="button" class="page-btn" data-page="' +
          (currentPage - 1) +
          '"' +
          (currentPage === 1 ? " disabled" : "") +
          ">이전</button>";
        for (var i = 1; i <= total; i++) {
          html +=
            '<button type="button" class="page-btn' +
            (i === currentPage ? " is-active" : "") +
            '" data-page="' +
            i +
            '">' +
            i +
            "</button>";
        }
        html +=
          '<button type="button" class="page-btn" data-page="' +
          (currentPage + 1) +
          '"' +
          (currentPage === total ? " disabled" : "") +
          ">다음</button>";
        nav.innerHTML = html;
      }

      function loadMoreMobile() {
        if (mobileLoadedCount >= allItems.length) return;
        var list = document.getElementById("gvList");
        var next = allItems.slice(mobileLoadedCount, mobileLoadedCount + ITEMS_PER_PAGE);
        next.forEach(function (item) {
          list.appendChild(createCard(item));
        });
        mobileLoadedCount += next.length;
      }

      function setupMobileInfiniteScroll() {
        var nav = document.getElementById("pagination");
        nav.style.display = "none";
        mobileLoadedCount = 0;
        document.getElementById("gvList").innerHTML = "";
        loadMoreMobile();
        if (observer) observer.disconnect();
        var scrollRoot = document.querySelector(".ti-mz-scroll");
        observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                loadMoreMobile();
              }
            });
          },
          { root: scrollRoot || null, rootMargin: "120px 0px" }
        );
        observer.observe(document.getElementById("loadSentinel"));
      }

      function setupDesktopPagination() {
        var nav = document.getElementById("pagination");
        nav.style.display = "flex";
        if (observer) observer.disconnect();
        currentPage = 1;
        renderDesktopPage();
        renderPagination();
      }

      function bindPaginationEvents() {
        document.getElementById("pagination").addEventListener("click", function (event) {
          var button = event.target.closest(".page-btn");
          if (!button || button.disabled) return;
          var page = Number(button.getAttribute("data-page") || 1);
          if (!page || page < 1 || page > getTotalPages() || page === currentPage) return;
          currentPage = page;
          renderDesktopPage();
          renderPagination();
          scrollContentToTop();
        });
      }

      function applyLayoutMode() {
        if (MOBILE_QUERY.matches) {
          setupMobileInfiniteScroll();
        } else {
          setupDesktopPagination();
        }
      }

      function boot() {
        refreshData();
        renderCount();
        bindPaginationEvents();
        applyLayoutMode();
        MOBILE_QUERY.addEventListener("change", applyLayoutMode);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
