<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ti-nav-current" content="gv-moment-test.html" />
  <title>GV 모먼트 — 테스트 UI · 55CINE</title>
  <link rel="icon" href="../favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../components/site-common.css" />
  <link rel="stylesheet" href="css/test-ti-fonts.css" />
  <link rel="stylesheet" href="css/test-ti-fonts-display.css" />
  <link rel="stylesheet" href="css/test-ti-shell.css" />
  <link rel="stylesheet" href="css/test-ti-site-footer.css" />
  <link rel="stylesheet" href="css/test-ti-page-pager.css" />
  <link rel="stylesheet" href="css/test-ti-magazine-preview.css" />
  <link rel="stylesheet" href="css/test-ti-magazine-list-pages.css" />
  <link rel="stylesheet" href="css/test-ti-carousel-chrome.css" />
</head>
<body class="ti">
  <div class="ti-shell" id="tiShell">
    <div class="ti-left">
      <div data-ti-mobile-menu-bar></div>
      <div class="ti-left-panel" id="tiLeftPanel">
        <div class="ti-left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="ti-footer ti-footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base="../"
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="ti-right ti-mz-panel" aria-label="GV 모먼트 본문">
      <div class="ti-mz-scroll">
        <section class="preview-page" aria-labelledby="gv-page-title">
          <header class="section-page-head">
            <div class="section-page-head__row">
              <h1 id="gv-page-title" class="section-page-head__title">
                <span class="section-page-head__parent">매거진 삼삼오오</span><span class="section-page-head__sep" aria-hidden="true">·</span><span class="section-page-head__child">GV 모먼트</span>
              </h1>
              <nav class="section-page-subnav" aria-label="매거진 삼삼오오 하위 메뉴">
                <a href="magazine-preview-test.html">프리뷰</a>
                <a href="magazine-serial-test.html">연재</a>
                <a href="gv-moment-test.html" class="is-current" aria-current="page">GV 모먼트</a>
                <a href="#" class="is-placeholder" tabindex="-1" aria-disabled="true">지난 기사</a>
              </nav>
            </div>
            <div class="section-page-head__rule" role="presentation"></div>
          </header>

          <div class="ti-page-toolbar">
            <div class="ti-page-toolbar__leading">
              <div class="view-mode" role="tablist" aria-label="목록 보기 방식">
                <button type="button" class="mode-btn is-active" data-view="thumb" role="tab" aria-selected="true" aria-label="썸네일형">
                  <img src="../images/ui/icon-view-thumb.svg" alt="" class="mode-btn__icon" width="18" height="18" decoding="async" />
                </button>
                <button type="button" class="mode-btn" data-view="list" role="tab" aria-selected="false" aria-label="목록형">
                  <img src="../images/ui/icon-view-list.svg" alt="" class="mode-btn__icon" width="18" height="18" decoding="async" />
                </button>
              </div>
              <p class="ti-page-count" id="pagerCount" aria-live="polite"></p>
            </div>
            <nav class="ti-page-pager" id="tiPagePager" aria-label="페이지"></nav>
          </div>

          <div id="mzThumbStack" class="mz-thumb-stack">
            <p class="se-hint" id="mzSwipeHint">좌우로 스와이프하여 페이지 이동</p>
            <div
              class="se-swipe-viewport"
              id="mzSwipeViewport"
              tabindex="0"
              role="region"
              aria-roledescription="캐러셀"
              aria-label="GV 모먼트 페이지. 좌우 스와이프로 전환"
            >
              <div class="se-swipe-track" id="mzSwipeTrack"></div>
            </div>
          </div>

          <div id="gvList" class="preview-list is-list" aria-live="polite" hidden></div>

          <footer class="se-foot mz-pager ti-pager-foot--mobile-only" aria-label="GV 모먼트 페이지네이션">
            <button type="button" class="se-page-btn" id="mzPagerPrev" aria-label="이전 페이지">이전</button>
            <span class="se-fraction" id="mzPagerFraction" aria-live="polite">1 / 1</span>
            <div class="se-page-dots" id="mzPagerDots" aria-hidden="true"></div>
            <button type="button" class="se-page-btn" id="mzPagerNext" aria-label="다음 페이지">다음</button>
          </footer>
        </section>
      </div>
    </aside>
    <footer
      class="ti-footer ti-footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base="../"
      aria-label="사이트 정보"
    ></footer>
  </div>

  <script src="js/test-ti-site-footer-include.js"></script>
  <script>
    window.TEST_TI_ASSET_BASE = "../";
  </script>
  <script src="../data/week-schedule-data.js"></script>
  <script src="../data/now-playing-data.js"></script>
  <script src="../data/gv-moment-data.js"></script>
  <script src="js/test-ti-left-gnb-include.js"></script>
  <script src="js/test-ti-mobile-menu.js"></script>
  <script src="js/test-ti-scroll-top.js"></script>
  <script src="js/test-ti-week-schedule.js"></script>
  <script>
    window.TEST_TI_MAGAZINE_CAROUSEL_CONFIG = {
      dataKey: "GV_MOMENT_DATA",
      listId: "gvList",
      itemClass: "gv-item",
      thumbLinkClass: "gv-thumb-link",
      thumbClass: "gv-thumb",
      titleWrapClass: "gv-title-wrap",
      titleLinkClass: "gv-title-link",
      titleClass: "gv-title",
      dateClass: "gv-date",
      useTitleWrap: true,
      showDate: true,
      resolveHref: function (item) {
        var path = item && item.detailUrl ? item.detailUrl : "";
        if (!path) return "";
        if (/^https?:\/\//i.test(path)) return path;
        return "../" + path.replace(/^\//, "");
      }
    };
  </script>
  <script src="js/test-ti-page-pager.js"></script>
  <script src="js/test-ti-carousel-dots.js"></script>
  <script src="js/test-ti-magazine-carousel-page.js"></script>
</body>
</html>
