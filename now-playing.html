<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/site-root.js"></script>
  <meta name="ti-nav-current" content="now-playing.html" />
  <title>현재 상영작 — 테스트 UI · 55CINE</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/fonts-display.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/components/shell-mobile-menu.css" />
  <link rel="stylesheet" href="css/components/shell-scroll-top.css" />
  <link rel="stylesheet" href="css/site-footer.css" />
  <link rel="stylesheet" href="css/page-pager.css" />
  <link rel="stylesheet" href="css/components/np-movie-grid.css" />
  <link rel="stylesheet" href="css/now-playing.css" />
  <link rel="stylesheet" href="css/components/np-search-toolbar.css" />
  <link rel="stylesheet" href="css/logo-spinner.css" />
</head>
<body class="ti">
  <div class="shell" id="tiShell">
    <div class="left">
      <div data-ti-mobile-menu-bar></div>
      <div class="left-panel" id="tiLeftPanel">
        <div class="left-gnb-mount" data-ti-left-gnb></div>
      </div>
      <footer
        class="footer footer--slot-pc site-footer"
        data-ti-site-footer
        data-ti-asset-base=""
        aria-label="사이트 정보"
      ></footer>
    </div>
    <aside class="right np-root np-list" aria-label="현재 상영작 본문">
      <div class="np-scroll">
        <div class="np-page">
          <header class="np-head">
            <h1 class="np-title" id="np-page-title">현재 상영작</h1>
          </header>
          <div class="np-meta" id="npCount" aria-live="polite"></div>
          <div class="np-grid" id="npGrid"></div>
          <!-- <p class="np-mobile-hint" id="npMobileHint">스크롤하면 다음 작품이 자동으로 불러와집니다.</p> -->
          <div class="np-sentinel" id="npSentinel" aria-hidden="true"></div>
          <p class="np-end" id="npEnd">모든 상영작을 불러왔습니다.</p>
          <nav class="page-pager page-pager--bottom" id="npPager" aria-label="페이지"></nav>
        </div>
      </div>
    </aside>
    <footer
      class="footer footer--slot-mobile site-footer"
      data-ti-site-footer
      data-ti-asset-base=""
      aria-label="사이트 정보"
    ></footer>
  </div>
  <script src="js/site-footer-include.js"></script>
  <!-- TI_ASSET_BASE: js/site-root.js -->
    <script src="js/api/client.js"></script>
<script src="data/week-schedule-data.js"></script>
  <script>
    window.TI_MOVIE_LIST_PAGE_CONFIG = {
      dataUrl: "movies/now-playing/data/now-playing-list.json",
      detailUrlMode: "query",
      detailSection: "now-playing",
      fetchList: function () {
        return window.TiApi.getMovieList("now-playing");
      }
    };
  </script>
  <script src="js/left-gnb-include.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/scroll-top.js"></script>
  <script src="js/week-schedule.js"></script>
  <script src="js/page-pager.js"></script>
  <script src="js/logo-spinner.js"></script>
  <script src="js/movie-list-page.js"></script>
</body>
</html>
