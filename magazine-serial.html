<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>55CINE - 매거진 삼삼오오 연재</title>
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="components/site-common.css" />
  <link rel="stylesheet" href="components/magazine-scroll-carousel.css" />
  <style>
    :root {
      --bg: #faf8f4;
      --bg-elevated: #fff;
      --text: #1c1610;
      --muted: #6b5d48;
      --line: #e8e2d6;
      --brand-ink: #1c1610;
      --brand-bronze: #8b6e3e;
      --brand-gold: #f0ab2a;
      --radius: 14px;
      --shadow: rgba(28, 22, 16, 0.12);
      --pill-bg: #f3efe6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--site-font-family);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    main { background: var(--bg-elevated); min-height: 100vh; }

    .serial-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    .page-sub {
      margin: 0 0 16px;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
    }
    .serial-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 12px var(--shadow);
    }
    .magazine-carousel-host .mz-thumb-stack .se-slide .serial-item {
      box-shadow: 0 4px 12px var(--shadow);
    }
    .serial-thumb-link {
      display: block;
      line-height: 0;
      background: #ece7db;
    }
    .serial-thumb {
      width: 100%;
      aspect-ratio: 264 / 200;
      object-fit: cover;
      display: block;
    }
    .serial-title-wrap {
      padding: 12px 14px 14px;
      min-height: 72px;
    }
    .serial-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.42;
      color: var(--brand-ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .serial-title-link:hover .serial-title {
      color: var(--brand-bronze);
      text-decoration: underline;
    }
    .serial-date {
      margin: 6px 0 0;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="site-header-mount"></div>
  <main>
    <section class="serial-page magazine-carousel-host" aria-labelledby="serial-page-title">
      <header class="section-page-head">
        <div class="section-page-head__row">
          <h1 id="serial-page-title" class="section-page-head__title">
            <span class="section-page-head__parent">매거진 삼삼오오</span><span class="section-page-head__sep" aria-hidden="true">·</span><span class="section-page-head__child">연재</span>
          </h1>
          <nav class="section-page-subnav" aria-label="매거진 삼삼오오 하위 메뉴">
            <a href="magazine-preview.html">프리뷰</a>
            <a href="magazine-serial.html" class="is-current" aria-current="page">연재</a>
            <a href="gv-moment.html">GV 모먼트</a>
            <a href="#" class="is-placeholder" tabindex="-1" aria-disabled="true">지난 기사</a>
          </nav>
        </div>
        <div class="section-page-head__rule" role="presentation"></div>
        <div class="section-page-head__meta">
          <span class="result-count" id="resultCount"></span>
        </div>
      </header>

      <p class="page-sub">장르 불문! 대구독립영화</p>

      <div class="toolbar">
        <div class="view-mode" role="tablist" aria-label="목록 보기 방식">
          <button type="button" class="mode-btn is-active" data-view="thumb" role="tab" aria-selected="true">썸네일형</button>
          <button type="button" class="mode-btn" data-view="list" role="tab" aria-selected="false">목록형</button>
        </div>
      </div>

      <div id="mzThumbStack" class="mz-thumb-stack">
        <p class="se-hint" id="mzSwipeHint">좌우로 스와이프하여 페이지 이동</p>
        <div
          class="se-swipe-viewport"
          id="mzSwipeViewport"
          tabindex="0"
          role="region"
          aria-roledescription="캐러셀"
          aria-label="매거진 연재. 좌우 스와이프로 전환"
        >
          <div class="se-swipe-track" id="mzSwipeTrack"></div>
        </div>
      </div>
      <div id="serialList" class="mz-page-list is-list" aria-live="polite" hidden></div>
      <footer class="se-foot mz-pager" aria-label="연재 페이지네이션">
        <button type="button" class="se-page-btn" id="mzPagerPrev" aria-label="이전 페이지">이전</button>
        <span class="se-fraction" id="mzPagerFraction" aria-live="polite">1 / 1</span>
        <div class="se-page-dots" id="mzPagerDots" aria-hidden="true"></div>
        <button type="button" class="se-page-btn" id="mzPagerNext" aria-label="다음 페이지">다음</button>
      </footer>
    </section>
  </main>
  <div id="site-footer-mount"></div>

  <script src="data/magazine-serial-data.js"></script>
  <script>
    window.__MZ_SCROLL_CAROUSEL__ = {
      dataKey: "MAGAZINE_SERIAL_DATA",
      cardStyle: "serial",
      ariaCarouselLabel: "매거진 연재. 좌우 스와이프로 전환",
      pagerAriaLabel: "연재 페이지네이션"
    };
  </script>
  <script defer src="components/magazine-scroll-carousel.js"></script>
  <script defer src="components/site-chrome.js"></script>
  <script defer src="components/site-font-switcher.js"></script>
  <script defer src="components/scroll-top.js"></script>
  <script>
    (function () {
      function initGnbMenu() {
        var gnbToggle = document.getElementById("gnbToggle");
        var gnbPanel = document.getElementById("gnb-panel");
        if (!gnbToggle || !gnbPanel) return;
        gnbToggle.addEventListener("click", function () {
          var open = gnbPanel.classList.toggle("is-open");
          gnbToggle.setAttribute("aria-expanded", open ? "true" : "false");
          gnbToggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
          if (!open) {
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
          }
        });
        document.querySelectorAll(".gnb-item > .gnb-depth1").forEach(function (depth1) {
          depth1.addEventListener("click", function (event) {
            if (!window.matchMedia("(max-width: 900px)").matches) return;
            if (!gnbPanel.classList.contains("is-open")) return;
            var item = depth1.closest(".gnb-item");
            if (!item || !item.querySelector(".gnb-dropdown")) return;
            event.preventDefault();
            var wasOpen = item.classList.contains("is-open");
            gnbPanel.querySelectorAll(".gnb-item.is-open").forEach(function (li) {
              li.classList.remove("is-open");
            });
            if (!wasOpen) item.classList.add("is-open");
          });
        });
      }

      function boot() {
        if (window.__MZ_SCROLL_CAROUSEL_BOOT__) window.__MZ_SCROLL_CAROUSEL_BOOT__();
        initGnbMenu();
      }

      function scheduleBoot() {
        var needs =
          document.getElementById("site-header-mount") ||
          document.getElementById("site-footer-mount");
        if (needs) {
          document.addEventListener("sitechrome:ready", boot, { once: true });
          document.addEventListener("sitechrome:error", boot, { once: true });
        } else {
          boot();
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", scheduleBoot, { once: true });
      } else {
        scheduleBoot();
      }
    })();
  </script>
</body>
</html>
